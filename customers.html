<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>לקוחות - עצמאי פלוס</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <style>
    :root {
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#172033;
      --text-dim:#667085;
      --line:#dbe3ef;
      --brand:#2563eb;
      --brand-dark:#1d4ed8;
      --ok:#16a34a;
      --warn:#f59e0b;
      --danger:#dc2626;
      --soft:#eff6ff;
      --shadow:0 16px 45px rgba(15,23,42,.08);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans Hebrew",sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37,99,235,.10), transparent 34%),
        linear-gradient(180deg,#f8fbff 0%,#f6f8fb 100%);
      color:var(--text);
      min-height:100vh;
    }
    a{color:inherit;text-decoration:none}
    .wrap{width:min(1180px,calc(100% - 28px));margin:0 auto}
    header{
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(10px);
    }
    .header-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:14px 0;
      flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:260px}
    .brand img{width:44px;height:44px;border-radius:14px;object-fit:cover;box-shadow:0 8px 20px rgba(37,99,235,.16)}
    .brand h1{margin:0;font-size:20px;line-height:1.1}
    .brand .sub{font-size:12px;color:var(--text-dim);margin-top:4px}
    .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .btn{
      border:0;
      border-radius:14px;
      padding:10px 14px;
      font:inherit;
      cursor:pointer;
      background:var(--brand);
      color:white;
      box-shadow:0 8px 18px rgba(37,99,235,.20);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      min-height:40px;
    }
    .btn:hover{background:var(--brand-dark)}
    .btn.secondary{background:white;color:var(--text);border:1px solid var(--line);box-shadow:none}
    .btn.secondary:hover{background:#f8fafc}
    .btn.danger{background:var(--danger)}
    .btn.small{padding:7px 10px;border-radius:12px;min-height:34px;font-size:13px}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    main{padding:22px 0 44px}
    .hero{
      background:linear-gradient(135deg, #ffffff 0%, #eef5ff 100%);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
      margin-bottom:14px;
    }
    .hero h2{margin:0 0 8px;font-size:23px}
    .hint{font-size:13px;color:var(--text-dim);line-height:1.55}
    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-top:14px;
    }
    .metric{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:12px;
    }
    .metric .k{font-size:12px;color:var(--text-dim)}
    .metric .v{font-size:20px;font-weight:800;margin-top:4px}
    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
      align-items:start;
    }
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

    .quickbar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .quickbar-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .hero-search{margin-top:14px;background:#fff;font-size:15px;min-height:48px}
    .btn.cta{
      min-height:46px;
      padding:12px 20px;
      border-radius:16px;
      font-size:15px;
      font-weight:850;
      background:linear-gradient(135deg,#2563eb,#1d4ed8);
      box-shadow:0 12px 26px rgba(37,99,235,.28);
    }
    .btn.cta:hover{background:linear-gradient(135deg,#1d4ed8,#1e40af)}
    .card{
      background:rgba(255,255,255,.96);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .card-hd{
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .card-hd h3{margin:0;font-size:16px}
    .card-bd{padding:16px}
    label{display:block;font-size:12px;color:var(--text-dim);margin:0 0 5px}
    input,select,textarea{
      width:100%;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      font:inherit;
      background:white;
      color:var(--text);
      outline:none;
    }
    input:focus,select:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(147,197,253,.22)}
    textarea{min-height:86px;resize:vertical}
    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .full{grid-column:1/-1}
    .toolbar{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    .toolbar .search{flex:1 1 260px}
    .table-scroll{overflow:auto;border:1px solid var(--line);border-radius:18px;background:white}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{padding:10px 11px;border-bottom:1px solid #edf1f7;text-align:right;font-size:13px;vertical-align:top}
    th{background:#f8fafc;color:#475467;font-weight:750;position:sticky;top:0;z-index:1}
    tr:hover td{background:#fcfdff}
    .empty{padding:26px;text-align:center;color:var(--text-dim)}
    .customer-list-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:10px;
    }
    .customer-list-card{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      padding:14px;
      cursor:pointer;
      transition:.15s ease;
    }
    .customer-list-card:hover{border-color:#bfdbfe;box-shadow:0 10px 24px rgba(37,99,235,.10);transform:translateY(-1px)}
    .customer-list-card.active{border-color:#60a5fa;background:#f8fbff}
    .customer-name-link{
      appearance:none;
      border:0;
      background:transparent;
      padding:0;
      margin:0;
      color:var(--text);
      font:inherit;
      font-weight:850;
      font-size:16px;
      cursor:pointer;
      text-align:right;
      display:block;
      width:100%;
    }
    .customer-name-link:hover{color:var(--brand);text-decoration:underline}
    .customer-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .customer-meta .meta-item{font-size:12px;color:#475467;background:#f8fafc;border:1px solid var(--line);border-radius:999px;padding:4px 8px}
    .customer-meta .meta-item.ok{background:#ecfdf5;border-color:#bbf7d0;color:#166534}
    .selected-actions{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      align-items:center;
      margin:10px 0 14px;
      padding:9px 10px;
      border:1px solid #e6edf6;
      border-radius:14px;
      background:#fbfdff;
    }
    .selected-actions .btn{
      min-height:34px;
      padding:7px 11px;
      font-size:12px;
      border-radius:10px;
      box-shadow:none;
    }
    .ledger-list{display:grid;gap:8px;margin-top:8px}
    .ledger-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px}
    .ledger-card .ledger-title{font-weight:800;margin-bottom:6px}
    .ledger-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px}
    .ledger-grid .k{font-size:11px;color:var(--text-dim)}
    .customer-card{
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      background:#fff;
      margin-bottom:10px;
    }
    .customer-card .name{font-weight:800;font-size:16px;margin-bottom:4px}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .chip{font-size:12px;border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:4px 8px;color:#475467}
    .chip.ok{background:#ecfdf5;border-color:#bbf7d0;color:#166534}
    .split{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:12px;
    }
    .info-box{
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      padding:12px;
    }
    .info-box h4{margin:0 0 8px;font-size:14px}
    .kv{display:grid;grid-template-columns:110px 1fr;gap:6px;font-size:13px;margin:4px 0}
    .kv .k{color:var(--text-dim)}
    .status{font-size:13px;color:var(--text-dim)}
    .status.err{color:var(--danger)}
    .toast{
      position:fixed;left:16px;right:16px;bottom:16px;z-index:50;
      display:none;
      padding:12px 14px;
      border-radius:16px;
      background:#111827;color:#fff;
      box-shadow:0 14px 30px rgba(0,0,0,.20);
      text-align:center;
    }
    .toast.show{display:block}
    .toast.err{background:#b91c1c}
    @media(max-width:900px){
      .grid{grid-template-columns:1fr}
      .stats{grid-template-columns:repeat(2,1fr)}
      .form-grid{grid-template-columns:1fr}
      .split{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .wrap{width:min(100% - 18px,1180px)}
      .brand h1{font-size:17px}
      .brand img{width:38px;height:38px}
      .top-actions{width:100%}
      .top-actions .btn{flex:1 1 auto}
      .stats{grid-template-columns:1fr 1fr}
      .metric .v{font-size:17px}
      .card-bd{padding:12px}
      .hero{padding:14px}
      .toolbar{align-items:stretch}
      .toolbar .btn{flex:1 1 auto}
      .customer-list-grid{grid-template-columns:1fr}
      .ledger-grid{grid-template-columns:1fr 1fr}
      .kv{grid-template-columns:96px 1fr}
      .selected-actions .btn{flex:1 1 auto}
    }
    @media print{
      header,.top-actions,.toolbar,#customerFormCard,.no-print{display:none !important}
      body{background:white}
      .card,.hero{box-shadow:none;border:1px solid #ddd}
      main{padding:0}
    }
  
    .document-history-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
    .small{padding:8px 12px;font-size:12px}
    .docs-history-table-wrap{width:100%;overflow-x:auto;border:1px solid #dbe3ef;border-radius:16px;background:white}
    .docs-history-table{width:100%;border-collapse:collapse;min-width:980px;font-size:13px}
    .docs-history-table th,.docs-history-table td{padding:8px 10px;border-bottom:1px solid #e5edf7;text-align:right;vertical-align:middle}
    .docs-history-table th{background:#f8fafc;color:#475569;font-weight:800;white-space:nowrap}
    .docs-history-table tr:last-child td{border-bottom:0}
    .docs-actions{display:flex;flex-direction:row;gap:6px;align-items:center;justify-content:flex-start;min-width:260px;flex-wrap:nowrap}
    .docs-actions .btn{padding:6px 10px;font-size:12px;min-height:auto;white-space:nowrap}
    .docs-mobile-title{display:none}

    .customer-card{text-align:right;direction:rtl}
    .customer-card .name,.customer-card .hint{text-align:right}
    .customer-card .chips{justify-content:flex-start}
    .doc-date-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
    .doc-view-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(15,23,42,.55)}
    .doc-view-modal.show{display:flex}
    .doc-view-box{width:min(980px,96vw);height:min(92vh,920px);background:white;border-radius:22px;box-shadow:0 30px 80px rgba(15,23,42,.28);border:1px solid #dbe3ef;overflow:hidden;display:flex;flex-direction:column;direction:rtl}
    .doc-view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #e5edf7;background:#f8fafc}
    .doc-view-title{font-weight:900;color:#0f2748}
    .doc-view-close{border:1px solid #dbe3ef;background:white;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;color:#0f2748}
    .doc-view-close:hover{background:#eef6ff}
    .doc-view-frame{border:0;width:100%;height:100%;background:white}
    @media(max-width:760px){
      .doc-view-modal{padding:10px}.doc-view-box{height:94vh;border-radius:18px}
      .docs-history-table-wrap{overflow-x:visible;border:0;background:transparent}
      .docs-history-table{min-width:0;width:100%;border-collapse:separate;border-spacing:0 10px}
      .docs-history-table thead{display:none}
      .docs-history-table tbody,.docs-history-table tr,.docs-history-table td{display:block;width:100%}
      .docs-history-table tr{background:white;border:1px solid #dbe3ef;border-radius:16px;padding:10px 12px;box-shadow:0 10px 24px rgba(15,39,72,.06)}
      .docs-history-table td{border-bottom:1px solid #eef3f8;padding:7px 0;text-align:right;display:flex;align-items:center;justify-content:space-between;gap:12px}
      .docs-history-table td:last-child{border-bottom:0;display:block;padding-top:10px}
      .docs-history-table td::before{content:attr(data-label);font-size:12px;font-weight:800;color:#64748b;white-space:nowrap}
      .docs-history-table td:last-child::before{display:none}
      .docs-actions{min-width:0;width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
      .docs-actions .btn{width:100%;padding:8px 6px;font-size:12px}
    }


    /* Customers list: clear desktop table with zebra rows */
    .customers-table-wrap{
      width:100%;
      overflow:auto;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
    }
    .customers-table{
      width:100%;
      min-width:760px;
      border-collapse:collapse;
    }
    .customers-table th,
    .customers-table td{
      padding:13px 14px;
      border-bottom:1px solid #e8eef6;
      text-align:right;
      vertical-align:middle;
    }
    .customers-table th{
      background:#eef4fb;
      color:#334155;
      font-size:12px;
      font-weight:850;
      white-space:nowrap;
    }
    .customers-table tbody tr:nth-child(even) td{background:#f7f9fc}
    .customers-table tbody tr:nth-child(odd) td{background:#fff}
    .customers-table tbody tr{
      cursor:pointer;
      outline:none;
    }
    .customers-table tbody tr:hover td,
    .customers-table tbody tr:focus td{
      background:#eef6ff;
    }
    .customers-table tbody tr:last-child td{border-bottom:0}
    .customers-table td:first-child{font-size:14px;color:#0f2748}
    .customer-id-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}


    .selected-card-nav{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      min-width:0;
    }
    .selected-card-nav-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:nowrap;
      min-width:0;
    }
    .selected-customer-status{
      white-space:nowrap;
    }
    .customer-switcher{position:relative;min-width:300px;max-width:380px;flex:0 1 380px}
    .customer-switcher input{height:40px;padding:9px 12px;border-radius:12px;background:#fff}
    .customer-switcher-results{position:absolute;top:calc(100% + 6px);right:0;left:0;z-index:50;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 36px rgba(15,39,72,.16);overflow:hidden;display:none;max-height:300px;overflow-y:auto}
    .customer-switcher-results.open{display:block}
    .customer-switcher-item{width:100%;border:0;border-bottom:1px solid #edf1f7;background:#fff;padding:10px 12px;text-align:right;cursor:pointer;font:inherit;color:var(--text)}
    .customer-switcher-item:last-child{border-bottom:0}
    .customer-switcher-item:hover,.customer-switcher-item.active{background:#eef6ff}
    .customer-switcher-item strong{display:block;color:#0f2748}
    .customer-switcher-item span{display:block;margin-top:2px;font-size:12px;color:var(--text-dim)}
    .customer-switcher-empty{padding:12px;color:var(--text-dim);font-size:13px}
    @media(max-width:700px){
      .selected-card-nav{width:100%;align-items:stretch}
      .selected-customer-status{width:100%}
      .selected-card-nav-actions{width:100%;flex-wrap:wrap}
      .customer-switcher{min-width:100%;max-width:none;flex:1 1 100%}
      .back-customers-btn{width:100%}
    }
    .back-customers-btn{
      background:#0f4b63;
      border-color:#0f4b63;
      color:#fff;
      box-shadow:0 8px 20px rgba(15,75,99,.18);
      font-weight:850;
    }
    .back-customers-btn:hover{
      background:#0c4055;
      border-color:#0c4055;
      transform:translateY(-1px);
    }

    .customer-details-section,
    .customer-documents-section{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      padding:16px;
    }
    .customer-documents-section{margin-top:14px}
    .section-title-row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:12px;
    }
    .section-title-row h4{
      margin:0 0 4px;
      font-size:17px;
      color:#0f2748;
    }
    .customer-detail-name{
      font-size:21px;
      font-weight:900;
      color:#0f2748;
      margin-top:4px;
    }

    .customer-details-table-wrap{
      overflow:hidden;
      border:1px solid #e2e8f0;
      border-radius:14px;
    }
    .customer-details-table{
      width:100%;
      min-width:0;
      border-collapse:collapse;
    }
    .customer-details-table th,
    .customer-details-table td{
      padding:11px 12px;
      border-bottom:1px solid #edf1f7;
      vertical-align:top;
    }
    .customer-details-table th{
      width:150px;
      background:#f8fafc;
      color:#64748b;
      font-size:12px;
      font-weight:800;
      position:static;
    }
    .customer-details-table td{
      background:#fff;
      color:#0f172a;
      font-size:13px;
    }
    .customer-details-table tr:last-child th,
    .customer-details-table tr:last-child td{border-bottom:0}

    .customer-doc-summary{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      margin-bottom:12px;
      border:1px solid #e2e8f0;
      border-radius:12px;
      background:#f8fafc;
      color:#475569;
      font-size:13px;
    }
    .customer-doc-summary strong{color:#0f2748}
    .summary-divider{width:1px;height:18px;background:#cbd5e1}
    .open-payment-summary,
    .payment-open{color:#b45309;font-weight:800}
    .payment-paid{color:#15803d;font-weight:800}
    .payment-na{color:#94a3b8}

    .customer-docs-table tbody tr:nth-child(even) td{background:#f8fafc}
    .customer-docs-table tbody tr:nth-child(odd) td{background:#fff}
    .customer-docs-table tbody tr.open-payment-row td{
      box-shadow:inset 0 1px 0 rgba(245,158,11,.08), inset 0 -1px 0 rgba(245,158,11,.08);
    }
    .payment-check-label{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin:0;
      cursor:pointer;
      white-space:nowrap;
    }
    .payment-check-label input{
      width:17px;
      height:17px;
      margin:0;
      accent-color:#15803d;
      box-shadow:none;
    }
    .payment-status-line{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:nowrap;
      white-space:nowrap;
    }
    .payment-inline-field{
      display:inline-flex;
      align-items:center;
      gap:5px;
      margin:0;
      font-size:12px;
      color:#64748b;
      white-space:nowrap;
    }
    .payment-inline-field input,
    .payment-inline-field select{
      width:auto;
      min-width:0;
      padding:4px 6px;
      font-size:12px;
    }
    .customer-docs-empty{
      border:1px dashed #cbd5e1;
      border-radius:14px;
      background:#f8fafc;
    }

    @media(max-width:760px){
      .customers-table-wrap{overflow:visible;border:0;background:transparent}
      .customers-table{min-width:0;border-collapse:separate;border-spacing:0 10px}
      .customers-table thead{display:none}
      .customers-table tbody,
      .customers-table tr,
      .customers-table td{display:block;width:100%}
      .customers-table tbody tr{
        border:1px solid #dbe3ef;
        border-radius:16px;
        overflow:hidden;
        box-shadow:0 8px 20px rgba(15,39,72,.05);
        background:#fff;
      }
      .customers-table tbody tr:nth-child(odd) td{background:#fff}
      .customers-table tbody tr:nth-child(even) td{background:#f7f9fc}
      .customers-table td{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        padding:9px 12px;
        border-bottom:1px solid #eef3f8;
      }
      .customers-table td:first-child{
        padding-top:12px;
        font-size:15px;
        background:#f8fafc !important;
      }

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtMcQNNvB65mhzmSVO1hkQ2Z3Snp-uITE",
  authDomain: "freelance-accounting-6c3bb.firebaseapp.com",
  projectId: "freelance-accounting-6c3bb",
  storageBucket: "freelance-accounting-6c3bb.firebasestorage.app",
  messagingSenderId: "196974556694",
  appId: "1:196974556694:web:60ba710567f2a7c67c6737"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const userTag = $("userTag");
const saveStatus = $("saveStatus");
const toast = $("toast");

$("btnBackToCustomers")?.addEventListener("click", showCustomerList);

let currentUser = null;
let userProfile = {};
let customers = [];
let ledgerDocuments = [];
let ledgerRows = [];
let editingId = null;
let selectedId = null;

const customerTypeLabels = {
  private: "פרטי",
  ptor: "עוסק פטור",
  murshe: "עוסק מורשה",
  company: "חברה בע״מ",
  nonprofit: "עמותה / מלכ״ר",
  other: "אחר"
};

const termsLabels = {
  immediate: "מיידי",
  net15: "שוטף + 15",
  net30: "שוטף + 30",
  net60: "שוטף + 60",
  custom: "אחר"
};

const paymentLabels = {
  credit: "אשראי",
  bank: "העברה בנקאית",
  cash: "מזומן",
  bit: "ביט / PayBox",
  check: "צ׳ק",
  standing_order: "הוראת קבע"
};

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showToast(msg, isError=false){
  toast.textContent = msg;
  toast.className = "toast show" + (isError ? " err" : "");
  setTimeout(() => { toast.className = "toast"; }, 2600);
}

function clean(value){ return String(value ?? "").trim(); }

async function writeAuditLog(action, details = {}){
  try {
    if (!currentUser?.uid) return;
    const nowIso = new Date().toISOString();
    await addDoc(collection(db, "ledgers", currentUser.uid, "auditLogs"), {
      action,
      createdAtIso: nowIso,
      email: currentUser.email || "",
      uid: currentUser.uid,
      entityType: details.entityType || "לקוחות",
      entityId: details.entityId || null,
      details: {
        ...details,
        email: currentUser.email || "",
        summary: details.summary || action
      },
      userAgent: navigator.userAgent || ""
    });
  } catch (err) {
    console.warn("Audit log failed", err);
  }
}

function customerFromForm(){
  return {
    id: editingId || (crypto?.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)),
    name: clean($("cName").value),
    type: $("cType").value,
    taxId: clean($("cTaxId").value),
    contact: clean($("cContact").value),
    phone: clean($("cPhone").value),
    email: clean($("cEmail").value).toLowerCase(),
    address: clean($("cAddress").value),
    city: clean($("cCity").value),
    zip: clean($("cZip").value),
    paymentTerms: $("cPaymentTerms").value,
    paymentMethod: $("cPaymentMethod").value,
    autoSendDocuments: $("cAutoSend").checked,
    notes: clean($("cNotes").value),
    updatedAt: new Date().toISOString(),
    createdAt: editingId ? (customers.find(c => c.id === editingId)?.createdAt || new Date().toISOString()) : new Date().toISOString(),
    documents: customers.find(c => c.id === editingId)?.documents || []
  };
}

function putForm(c){
  $("cName").value = c?.name || "";
  $("cType").value = c?.type || "private";
  $("cTaxId").value = c?.taxId || "";
  $("cContact").value = c?.contact || "";
  $("cPhone").value = c?.phone || "";
  $("cEmail").value = c?.email || "";
  $("cAddress").value = c?.address || "";
  $("cCity").value = c?.city || "";
  $("cZip").value = c?.zip || "";
  $("cPaymentTerms").value = c?.paymentTerms || "immediate";
  $("cPaymentMethod").value = c?.paymentMethod || "";
  $("cAutoSend").checked = !!c?.autoSendDocuments;
  $("cNotes").value = c?.notes || "";
}

function clearForm(){
  editingId = null;
  $("formTitle").textContent = "לקוח חדש";
  $("formStatus").textContent = "";
  putForm({});
}

function openForm(c=null){
  editingId = c?.id || null;
  $("formTitle").textContent = editingId ? "עריכת לקוח" : "לקוח חדש";
  putForm(c || {});
  $("customerFormCard").style.display = "";
  $("customerFormCard").scrollIntoView({behavior:"smooth", block:"start"});
}

function closeForm(){
  $("customerFormCard").style.display = "none";
  clearForm();
}

function validateCustomer(c){
  if (!c.name) return "יש להזין שם לקוח / שם עסק.";
  if (c.email && !/^\S+@\S+\.\S+$/.test(c.email)) return "כתובת המייל אינה תקינה.";
  return "";
}

async function saveCustomers(){
  if (!currentUser) return;
  saveStatus.textContent = "שומר…";
  await setDoc(doc(db, "ledgers", currentUser.uid), {
    customers,
    customersUpdatedAt: new Date().toISOString()
  }, { merge: true });
  saveStatus.textContent = `נשמרו ${customers.length} לקוחות`;
}

async function saveCurrentCustomer(){
  const c = customerFromForm();
  const err = validateCustomer(c);
  if (err) {
    $("formStatus").textContent = err;
    $("formStatus").className = "status err";
    return;
  }
  const idx = customers.findIndex(x => x.id === c.id);
  const isUpdate = idx >= 0;
  const previous = isUpdate ? {...customers[idx]} : null;
  if (isUpdate) customers[idx] = c;
  else customers.unshift(c);
  selectedId = c.id;
  await saveCustomers();
  await writeAuditLog(isUpdate ? "לקוח עודכן" : "לקוח נוצר", {
    entityType: "לקוח",
    entityId: c.id,
    customerId: c.id,
    customerName: c.name,
    customerEmail: c.email || "",
    customerPhone: c.phone || "",
    previousName: previous?.name || "",
    summary: `${isUpdate ? "עודכן" : "נוצר"} לקוח: ${c.name}`
  });
  render();
  closeForm();
  showToast("הלקוח נשמר ✅");
}

async function deleteCustomer(id){
  const c = customers.find(x => x.id === id);
  if (!c) return;
  const ok = confirm(`למחוק את הלקוח "${c.name}"?`);
  if (!ok) return;
  customers = customers.filter(x => x.id !== id);
  if (selectedId === id) selectedId = null;
  await saveCustomers();
  await writeAuditLog("לקוח נמחק", {
    entityType: "לקוח",
    entityId: c.id,
    customerId: c.id,
    customerName: c.name,
    customerEmail: c.email || "",
    customerPhone: c.phone || "",
    summary: `נמחק לקוח: ${c.name}`
  });
  render();
  showToast("הלקוח נמחק");
}

function setCustomerQuickbarVisible(visible){
  const quickbar = document.querySelector(".customer-quickbar");
  if (quickbar) quickbar.style.display = visible ? "" : "none";
}

function selectCustomer(id){
  selectedId = id;
  const listSection = $("customersSection");
  const selectedCard = $("selectedCard");
  setCustomerQuickbarVisible(false);
  if (listSection) listSection.style.display = "none";
  if (selectedCard) selectedCard.style.display = "";
  renderSelected();
  selectedCard?.scrollIntoView({behavior:"smooth", block:"start"});
}

function showCustomerList(){
  selectedId = null;
  syncCustomerSearch("");
  const listSection = $("customersSection");
  const selectedCard = $("selectedCard");
  setCustomerQuickbarVisible(true);
  if (selectedCard) selectedCard.style.display = "none";
  if (listSection) listSection.style.display = "";
  render();
  listSection?.scrollIntoView({behavior:"smooth", block:"start"});
}

function customerMatches(c, q){
  if (!q) return true;
  const text = [
    c.name, c.taxId, c.contact, c.phone, c.email, c.address, c.city, c.notes,
    customerTypeLabels[c.type]
  ].join(" ").toLowerCase();
  return text.includes(q.toLowerCase());
}

function renderStats(){
  const statCustomers = $("statCustomers");
  if (!statCustomers) return;
  statCustomers.textContent = customers.length;
  $("statEmails").textContent = customers.filter(c => c.email).length;
  $("statPhones").textContent = customers.filter(c => c.phone).length;
  $("statDocs").textContent = customers.reduce((sum,c) => sum + (Array.isArray(c.documents) ? c.documents.length : 0), 0);
}

function getCustomerSearch(){
  const top = $("qTop");
  return ((top && top.value) || "").trim();
}

function syncCustomerSearch(value){
  const el = $("qTop");
  if (el && el.value !== value) el.value = value;
}

function render(){
  renderStats();

  if (selectedId && customers.some(c => c.id === selectedId)) {
    const listSection = $("customersSection");
    const selectedCard = $("selectedCard");
    setCustomerQuickbarVisible(false);
    if (listSection) listSection.style.display = "none";
    if (selectedCard) selectedCard.style.display = "";
    renderSelected();
    return;
  }

  const q = getCustomerSearch();
  const filtered = (q
    ? customers.filter(c => customerMatches(c, q))
    : customers.slice()
  ).sort((a,b) => String(a.name || "").localeCompare(String(b.name || ""), "he"));

  const list = $("customersList");
  const listSection = $("customersSection");
  const selectedCard = $("selectedCard");

  setCustomerQuickbarVisible(true);
  if (listSection) listSection.style.display = "";
  if (selectedCard) selectedCard.style.display = "none";

  if (!filtered.length) {
    list.innerHTML = `<div class="empty">${customers.length ? "לא נמצאו לקוחות בחיפוש." : "עדיין אין לקוחות. לחצו על הוספת לקוח חדש כדי להתחיל."}</div>`;
    return;
  }

  const rows = filtered.map(c => {
    const docsCount = docsForCustomer(c).length;
    return `
      <tr class="customer-row"
          tabindex="0"
          role="button"
          data-action="select"
          data-id="${escapeHtml(c.id)}"
          aria-label="פתיחת כרטיס לקוח ${escapeHtml(c.name)}">
        <td data-label="שם לקוח"><strong>${escapeHtml(c.name || "—")}</strong></td>
        <td data-label="סוג לקוח">${escapeHtml(customerTypeLabels[c.type] || "אחר")}</td>
        <td data-label="ח.פ / ע.מ / ת.ז"><span class="customer-id-ltr">${escapeHtml(c.taxId || "—")}</span></td>
        <td data-label="מייל">${escapeHtml(c.email || "—")}</td>
        <td data-label="מסמכים"><strong>${docsCount}</strong></td>
      </tr>
    `;
  }).join("");

  list.innerHTML = `
    <div class="customers-table-wrap">
      <table class="customers-table">
        <thead>
          <tr>
            <th>שם לקוח</th>
            <th>סוג לקוח</th>

  `;

function money(value){
  return Number(value || 0).toLocaleString("he-IL", {style:"currency", currency:"ILS"});
}

function normalizeCustomerMatchName(value){
  return String(value || "")
    .replace(/[\u200e\u200f\u202a-\u202e]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

function importedRowCustomerNameCandidates(row){
  const candidates = [
    row?.clientName,
    row?.customerName,
    row?.businessName,
    row?.partyName,
    row?.client
  ];

  // Historical CSV imports store the description as: "<document type/number> - <customer name>".
  // Some old/stale row versions may have lost customerId/clientName while the description survived.
  const desc = String(row?.desc || "").replace(/\s+/g, " ").trim();
  if (desc.includes(" - ")) {
    const suffix = desc.split(" - ").slice(1).join(" - ").trim();
    if (suffix) candidates.push(suffix);
  }

  return Array.from(new Set(candidates.map(normalizeCustomerMatchName).filter(Boolean)));
}

function importedRowBelongsToCustomer(row, customer){
  if (!row || row.type !== "income" || row.source !== "csvImport" || !customer) return false;

  const customerId = String(customer.id || "");
  const rowCustomerId = String(row.customerId || "");
  if (customerId && rowCustomerId === customerId) return true;

  // If the saved ID is missing/stale, use the surviving imported customer name only when
  // that name identifies exactly one existing customer. This is display-only; no Firestore write.
  const candidates = importedRowCustomerNameCandidates(row);
  if (!candidates.length) return false;

  const currentName = normalizeCustomerMatchName(customer.name || customer.businessName || customer.customerName);
  if (!currentName || !candidates.includes(currentName)) return false;

  const matchingCustomers = customers.filter(c => {
    const name = normalizeCustomerMatchName(c?.name || c?.businessName || c?.customerName);
    return name && candidates.includes(name);
  });
  return matchingCustomers.length === 1 && String(matchingCustomers[0]?.id || "") === customerId;
}

function docsForCustomer(customer){
  const fullDocs = ledgerDocuments.filter(d => String(d.customerId || "") === String(customer.id || ""));
  const summaryDocs = Array.isArray(customer.documents) ? customer.documents : [];
  const importedIncome = ledgerRows
    .filter(r => importedRowBelongsToCustomer(r, customer))
    .map(r => ({
      id: r.id || "",
      date: r.date || "",
      number: r.docNumber || "",
      type: r.docType || "imported_income",
      typeLabel: (() => {
        if (r.docType) return r.docType;
        const t = String(r.desc || "").replace(/\s+/g," ").trim();
        if (/חשבונית\s*(מס\s*)?[/\-]?\s*קבלה|חשבונית\s+קבלה/i.test(t)) return "חשבונית מס/קבלה";
        if (/זיכוי/i.test(t)) return "חשבונית זיכוי";
        if (/חשבונית\s+עסקה/i.test(t)) return "חשבונית עסקה";
        if (/קבלה/i.test(t) && !/חשבונית/i.test(t)) return "קבלה";
        if (/חשבונית/i.test(t)) return "חשבונית מס";
        return "הכנסה מיובאת";
      })(),
      gross: Number(r.amount || 0),
      desc: r.desc || "",
      valueDate: r.valueDate || "",
      paid: !!r.paid,
      paidAt: r.paidAt || null,
      paymentMethod: r.paymentMethod || "",
      _importedIncome: true,
      createdAt: r.createdAt || ""
    }));
  const byKey = new Map();
  fullDocs.forEach(d => byKey.set(String(d.id || `${d.type}-${d.number}`), d));
  summaryDocs.forEach(d => {
    const key = String(d.id || `${d.type}-${d.number}`);
    if (!byKey.has(key)) byKey.set(key, d);
  });
  importedIncome.forEach(d => byKey.set(`import-${d.id || `${d.date}-${d.number}-${d.gross}`}`, d));
  return Array.from(byKey.values()).sort((a,b) => {
    const dateA = String(a.date || a.issuedAt || a.createdAt || "").slice(0,10);
    const dateB = String(b.date || b.issuedAt || b.createdAt || "").slice(0,10);
    const byDate = dateB.localeCompare(dateA); // newest document first
    if (byDate) return byDate;
    return String(b.number || "").localeCompare(String(a.number || ""), "he", {numeric:true});
  });
}

function documentDisplayType(d){
  const raw = d.typeLabel || d.type || "מסמך";
  const map = {
    deal_invoice: "חשבונית עסקה",
    tax_invoice: "חשבונית מס",
    tax_invoice_receipt: "חשבונית מס/קבלה",
    receipt: "קבלה",
    credit_note: "חשבונית זיכוי",
    quote: "הצעת מחיר"
  };
  return map[raw] || raw;
}

function documentDisplayTotal(d){
  return Number(d.gross ?? d.total ?? d.debit ?? d.balance ?? 0);
}

function normalizedDocumentType(d){
  return String(documentDisplayType(d) || "").trim();
}

function isCreditDocument(d){
  return normalizedDocumentType(d).includes("זיכוי");
}

function isReceiptDocument(d){
  return normalizedDocumentType(d).includes("קבלה");
}

function isTaxInvoiceDocument(d){
  const type = normalizedDocumentType(d);
  return type.includes("חשבונית מס") && !type.includes("זיכוי");
}

function isTransactionInvoiceDocument(d){
  const type = normalizedDocumentType(d);
  return type.includes("חשבונית עסקה") && !type.includes("זיכוי");
}

function documentLifecycleStatus(d){
  return String(d?.status || "").trim().toLowerCase();
}

function isCancelledIssuedDocument(d){
  return ["cancelled", "cancelled_technical_duplicate"].includes(documentLifecycleStatus(d));
}

function isCreditedIssuedDocument(d){
  return documentLifecycleStatus(d) === "credited";
}

function isPayableInvoice(d){
  if (isCancelledIssuedDocument(d) || isCreditedIssuedDocument(d)) return false;
  const type = normalizedDocumentType(d);
  // Imported historical income can arrive with the generic document type "חשבונית".
  // Treat that generic imported invoice as payable too, while still excluding
  // receipts / invoice-receipts and credit documents.
  const importedGenericInvoice = !!d._importedIncome && type.includes("חשבונית");
  const invoiceLike = isTaxInvoiceDocument(d) || isTransactionInvoiceDocument(d) || importedGenericInvoice;
  return invoiceLike && !type.includes("קבלה") && !isCreditDocument(d);
}

const importedPaymentMethodLabels = {
  bank_transfer: "העברה בנקאית",
  bit: "ביט",
  cash: "מזומן",
  credit_card: "כרטיס אשראי",
  check: "צ׳ק",
  paypal: "PayPal",
  paybox: "PayBox",
  other: "אחר"
};

function importedPaymentMethodLabel(value){
  return importedPaymentMethodLabels[value] || value || "";
}

function customerRevenueTotal(docs){
  // Imported income linked to the customer is part of the customer's revenue history,
  // but remains explicitly marked as imported and is not treated as a document issued here.
  const importedIncome = docs.filter(d => d._importedIncome);
  const issuedDocs = docs.filter(d => !d._importedIncome && !isCancelledIssuedDocument(d));

  const taxInvoices = issuedDocs.filter(d => isTaxInvoiceDocument(d));
  const receipts = issuedDocs.filter(d => isReceiptDocument(d) && !normalizedDocumentType(d).includes("חשבונית"));
  const transactionInvoices = issuedDocs.filter(d => isTransactionInvoiceDocument(d));
  const credits = issuedDocs.filter(d => isCreditDocument(d));

  let source = taxInvoices;
  if (!source.length) source = receipts;
  if (!source.length) source = transactionInvoices;

  const sourceWithCredits = source.length ? [...source, ...credits] : credits;
  const issuedTotal = sourceWithCredits.reduce((sum, d) => {
    const sign = isCreditDocument(d) ? -1 : 1;
    return sum + (sign * documentDisplayTotal(d));
  }, 0);

  const importedTotal = importedIncome.reduce((sum, d) => sum + Math.abs(documentDisplayTotal(d)), 0);
  return issuedTotal + importedTotal;
}

function openInvoiceSummary(docs){
  const openDocs = docs.filter(d => isPayableInvoice(d) && !d.paid);
  return {
    count: openDocs.length,
    total: openDocs.reduce((sum, d) => sum + documentDisplayTotal(d), 0)
  };
}

function formatDisplayDate(value){
  if (!value) return "—";
  const str = String(value).trim();
  const iso = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
  const d = new Date(str);
  if (!Number.isNaN(d.getTime())) {
    return d.toLocaleDateString("he-IL", { year:"numeric", month:"2-digit", day:"2-digit" });
  }
  return str;
}

function showStoredDocumentModal(html, title){
  const modal = $("docViewModal");
  const frame = $("docViewFrame");

  titleEl.textContent = title || "צפייה במסמך";
  frame.srcdoc = html;
  modal.classList.add("show");
  modal.setAttribute("aria-hidden", "false");
  return true;
}

function closeStoredDocumentModal(){
  const modal = $("docViewModal");
  const frame = $("docViewFrame");
  if (!modal || !frame) return;
  modal.classList.remove("show");
  modal.setAttribute("aria-hidden", "true");
  frame.srcdoc = "";
}

        unicode-bidi:embed;
        direction:rtl;
      }
    </style>`;

  if (out.includes("</head>")) {
    out = out.replace("</head>", `${pdfTextFix}</head>`);
  } else {
    out = pdfTextFix + out;
  }

  return out;
}

function normalizeStoredDocumentHtml(html, d){
  const title = `${escapeHtml(documentDisplayType(d))} ${escapeHtml(d.number || "")}`.trim();
  const customerRightFix = `
    <style id="azmai-customer-right-fix">
      html,body{direction:rtl!important;text-align:right!important;}
      .doc-parties{display:block!important;direction:rtl!important;text-align:right!important;margin-bottom:18px!important;}
      .doc-parties .box,.doc-parties .customer-box,.customer-box{
        display:block!important;
        float:right!important;
        clear:both!important;
        width:46%!important;
        min-width:240px!important;
        margin:0!important;
        text-align:right!important;
        direction:rtl!important;
      }
      .doc-parties:after{content:"";display:block;clear:both;}
      .customer-box *{text-align:right!important;direction:rtl!important;}
      .doc-date-ltr{direction:ltr!important;unicode-bidi:isolate!important;display:inline-block!important;}
    </style>`;

  let out = String(html || "");
  if (!out.trim().toLowerCase().startsWith("<!doctype") && !out.trim().toLowerCase().startsWith("<html")) {
    out = `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>${title}</title></head><body>${out}</body></html>`;
  }
  if (out.includes('</head>')) out = out.replace('</head>', `${customerRightFix}</head>`);
  else out = customerRightFix + out;
  out = polishHebrewPdfHtml(out);
  return out;
}

async function waitForFrameImages(frameDocument){
  const images = Array.from(frameDocument?.images || []);
  await Promise.all(images.map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => {
      img.addEventListener("load", resolve, {once:true});
      img.addEventListener("error", resolve, {once:true});
    });
  }));
}

async function documentHtmlToPdfBase64(documentHtml, fileName){
  const iframe = document.createElement("iframe");
  iframe.setAttribute("aria-hidden", "true");
  iframe.style.position = "fixed";
  iframe.style.left = "0";
  iframe.style.top = "0";
  iframe.style.width = "794px";
  iframe.style.height = "1123px";
  iframe.style.opacity = "1";
  iframe.style.visibility = "visible";
  iframe.style.zIndex = "2147483647";
  iframe.style.background = "#ffffff";
  iframe.style.border = "0";
  iframe.style.pointerEvents = "none";
  iframe.srcdoc = documentHtml;
  document.body.appendChild(iframe);

  try {
    await new Promise((resolve, reject) => {
      const timeout = setTimeout(
        () => reject(new Error("טעינת המסמך ל־PDF נמשכה זמן רב מדי.")),
        15000
      );

      iframe.addEventListener("load", () => {
        clearTimeout(timeout);
        resolve();
      }, {once:true});
    });

    const frameDocument = iframe.contentDocument;
    const frameWindow = iframe.contentWindow;

    if (!frameDocument?.body || !frameWindow) {
      throw new Error("לא ניתן היה להכין את המסמך ל־PDF.");
    }

    await waitForFrameImages(frameDocument);

    // Preserve the customer block exactly as in the last good version.
    frameDocument.querySelectorAll(".customer-box").forEach(container => {
      const walker = frameDocument.createTreeWalker(
        container,
        frameWindow.NodeFilter.SHOW_TEXT
      );

      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      textNodes.forEach(node => {
        node.nodeValue = String(node.nodeValue || "")
          .replace(/ /g, "\u00A0")
          .replace(/:/g, ":\u200F");
      });
    });

    // Fix only the business email line. Mixed Hebrew + an LTR email address
    // otherwise causes the label and colon to jump to the wrong side.
    const businessMeta = frameDocument.querySelector(
      ".doc-head > div:first-child .doc-meta"
    );

    if (businessMeta) {
      const parts = businessMeta.innerHTML
        .split(/<br\s*\/?\s*>/i)
        .map(part => part.trim())
        .filter(Boolean);

      businessMeta.innerHTML = parts.map(part => {
        const holder = frameDocument.createElement("div");
        holder.innerHTML = part;
        const plain = String(holder.textContent || "").trim();

        if (/^מייל\s*:/.test(plain)) {
          const email = plain.replace(/^מייל\s*:\s*/, "").trim();
          return `<span dir="rtl" style="white-space:nowrap">
            מייל:&nbsp;<span dir="ltr"
              style="display:inline-block;unicode-bidi:isolate">${escapeHtml(email)}</span>
          </span>`;
        }

        // Keep the original markup and only protect intended spaces.
        return part.replace(/ /g, "&nbsp;");
      }).join("<br>");
    }

    // Preserve spaces only in the description column, without touching
    // quantities, prices or totals.
    frameDocument
      .querySelectorAll(".items tbody tr td:first-child")
      .forEach(cell => {
        const walker = frameDocument.createTreeWalker(
          cell,
          frameWindow.NodeFilter.SHOW_TEXT
        );

        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);

        textNodes.forEach(node => {
          node.nodeValue = String(node.nodeValue || "").replace(/ /g, "\u00A0");
        });
      });

    // Load html2pdf inside the iframe itself. Rendering a document from the
    // parent window can produce a blank PDF on mobile browsers.
    if (!frameWindow.html2pdf) {
      await new Promise((resolve, reject) => {
        const script = frameDocument.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js";
        script.onload = resolve;
        script.onerror = () => reject(
          new Error("רכיב יצירת ה־PDF לא נטען בתוך המסמך.")
        );
        frameDocument.head.appendChild(script);
      });
    }

    await new Promise(resolve => setTimeout(resolve, 350));

    const dataUri = await frameWindow.html2pdf()
      .set({
        margin: 8,
        filename: fileName,
        image: {type: "jpeg", quality: 0.98},
        html2canvas: {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: "#ffffff",
          logging: false,
          windowWidth: 794,
          windowHeight: Math.max(
            1123,
            frameDocument.documentElement.scrollHeight || 1123
          )
        },
        jsPDF: {
          unit: "mm",
          format: "a4",
          orientation: "portrait"
        },
        pagebreak: {
          mode: ["css", "legacy"],
          avoid: ["tr", ".box", ".totals"]
        }
      })
      .from(frameDocument.body)
      .outputPdf("datauristring");

    const base64 = String(dataUri || "").split(",")[1];

    if (!base64) {
      throw new Error("יצירת קובץ ה־PDF נכשלה.");
    }

    return base64;
  } finally {
    iframe.remove();
  }
}

function renderCustomerSwitcherResults(){
  const input = $("customerSwitcherInput");
  const results = $("customerSwitcherResults");
  if (!input || !results || !selectedId) return;

  const q = String(input.value || "").trim();
  if (!q) {
    closeCustomerSwitcher();
    return;
  }

  const matches = customers
    .filter(c => c.id !== selectedId && customerMatches(c, q))
    .sort((a,b) => String(a.name || "").localeCompare(String(b.name || ""), "he"))
    .slice(0, 8);

  if (!matches.length) {
    results.innerHTML = `<div class="customer-switcher-empty">לא נמצאו לקוחות מתאימים.</div>`;
    results.classList.add("open");
    return;
  }

  results.innerHTML = matches.map(c => {
    const secondary = [c.taxId, c.email, c.phone].filter(Boolean).join(" · ");
    return `<button type="button" class="customer-switcher-item" data-customer-switch-id="${escapeHtml(c.id)}" role="option"><strong>${escapeHtml(c.name || "—")}</strong>${secondary ? `<span>${escapeHtml(secondary)}</span>` : ""}</button>`;
  }).join("");
  results.classList.add("open");
}

async function cancelNonAccountingSourceDocument(docId){
  const d = ledgerDocuments.find(x => String(x.id || "") === String(docId || ""));
  if(!d) return showToast("המסמך לא נמצא.", true);
  const type = documentDisplayType(d);
  if(!["הצעת מחיר","חשבונית עסקה"].includes(type)) return showToast("פעולת ביטול זו זמינה רק להצעת מחיר או לחשבונית עסקה.", true);

  try{
    const cancelledAt=new Date().toISOString();
    await setDoc(doc(db,"ledgers",currentUser.uid,"documents",String(d.id)),{status:"cancelled",cancelledAt},{merge:true});

  }
}

function addDaysToIso(dateStr, days){
  const d = new Date(String(dateStr || "") + "T12:00:00");
  if (Number.isNaN(d.getTime())) return dateStr || "";
  d.setDate(d.getDate() + Number(days || 0));
  return d.toISOString().slice(0,10);
}
function monthEndPlus(dateStr, days){
  const d = new Date(String(dateStr || "") + "T12:00:00");
  if (Number.isNaN(d.getTime())) return dateStr || "";
  const eom = new Date(d.getFullYear(), d.getMonth()+1, 0, 12, 0, 0);
  eom.setDate(eom.getDate() + Number(days || 0));
  return eom.toISOString().slice(0,10);
}
function ledgerValueDate(d, customer){
  if (d.valueDate || d.dueDate) return d.valueDate || d.dueDate;
  const type = normalizedDocumentType(d);
  const docDate = d.date || "";
  if (type.includes("קבלה") || type.includes("זיכוי")) return docDate;
  const terms = customer?.paymentTerms || "immediate";
  if (terms === "net15") return monthEndPlus(docDate, 15);
  if (terms === "net30") return monthEndPlus(docDate, 30);
  if (terms === "net60") return monthEndPlus(docDate, 60);
  return docDate;
}
function ledgerDebitCredit(d){
  let debit = Number(d.debit || 0);
  let credit = Number(d.credit || 0);
  if (debit || credit) return {debit, credit};

  const type = normalizedDocumentType(d);
  const total = Math.abs(documentDisplayTotal(d));
  if (type.includes("חשבונית מס/קבלה") || type.includes("חשבונית קבלה")) {
    debit = total; credit = total;
  } else if (type.includes("זיכוי")) {
    credit = total;
  } else if (type.includes("קבלה")) {
    credit = total;
  } else if (type.includes("חשבונית")) {
    debit = total;
  } else if (d._importedIncome) {
    debit = total;
  }
  return {debit, credit};
}

function printCustomerLedger(id){
  const c = customers.find(x => x.id === id);
  if (!c) return;
  const docs = docsForCustomer(c).slice().sort((a,b) => String(a.date || "").localeCompare(String(b.date || "")));
  const movements = [];
  docs.forEach(d => {
    if (isCancelledIssuedDocument(d)) return;
    const {debit, credit} = ledgerDebitCredit(d);
    const detailsBase = d.documentTitle || d.title || d.desc || documentDisplayType(d);
    const details = `${detailsBase || documentDisplayType(d)}`;
    movements.push({
      date: d.date || "",
      valueDate: ledgerValueDate(d, c),
      details,
      number: d.number || "",
      debit,
      credit,
      order: 1
    });

    if (d._importedIncome && isPayableInvoice(d) && d.paid) {
      const paidDate = String(d.paidAt || d.date || "").slice(0,10);
      movements.push({
        date: paidDate,
        valueDate: paidDate,
        details: `תשלום עבור ${documentDisplayType(d)} ${d.number || ""}${d.paymentMethod ? ` · ${importedPaymentMethodLabel(d.paymentMethod)}` : ""}`,
        number: d.number || "",
        debit: 0,
        credit: Math.abs(documentDisplayTotal(d)),
        order: 2
      });
    }

    String(a.date || "").localeCompare(String(b.date || "")) ||
    Number(a.order || 0) - Number(b.order || 0)

function exportCsv(){

  const body = customers.map(c => [
    c.name,
    customerTypeLabels[c.type] || c.type || "",
    c.taxId,
    c.contact,
    c.phone,
    c.email,
    c.address,
    c.city,
    c.zip,
    termsLabels[c.paymentTerms] || c.paymentTerms || "",
    paymentLabels[c.paymentMethod] || c.paymentMethod || "",
    c.notes
  ]);
  const csv = [header, ...body].map(row => row.map(v => `"${String(v ?? "").replaceAll('"','""')}"`).join(",")).join("\n");
  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "customers.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

async function recoverImportedPaymentStatusFromAudit(){
  if (!currentUser?.uid || !Array.isArray(ledgerRows) || !ledgerRows.length) return false;

  try {
    const auditSnap = await getDocs(collection(db, "ledgers", currentUser.uid, "auditLogs"));
    const recoveredByRow = new Map();

    const ensureRow = (rowId) => {
      if (!recoveredByRow.has(rowId)) recoveredByRow.set(rowId, {
        paidStamp: "", paid: undefined, paidAtFromPaid: undefined,
        dateStamp: "", paidAt: undefined,
        methodStamp: "", paymentMethod: undefined
      });
      return recoveredByRow.get(rowId);
    };

    auditSnap.docs.forEach(snap => {
      const a = snap.data() || {};
      const action = String(a.action || "");
      const details = a.details || {};
      const rowId = String(a.entityId || details.entityId || "");
      if (!rowId) return;
      const stamp = String(a.createdAtIso || details.createdAtIso || a.createdAtClient || details.createdAtClient || "");
      const rec = ensureRow(rowId);

      if (action === "הכנסה מיובאת סומנה כשולמה" || action === "הכנסה מיובאת נפתחה מחדש לתשלום") {
        if (!rec.paidStamp || stamp >= rec.paidStamp) {
          rec.paidStamp = stamp;
          rec.paid = action === "הכנסה מיובאת סומנה כשולמה";
          rec.paidAtFromPaid = rec.paid ? (details.paidAt || null) : null;
        }
      } else if (action === "תאריך תשלום להכנסה מיובאת עודכן") {
        if (!rec.dateStamp || stamp >= rec.dateStamp) {
          rec.dateStamp = stamp;
          rec.paidAt = details.paidAt || null;
        }
      } else if (action === "אמצעי תשלום להכנסה מיובאת עודכן") {
        if (!rec.methodStamp || stamp >= rec.methodStamp) {
          rec.methodStamp = stamp;
          rec.paymentMethod = String(details.paymentMethod || "");
        }
      }
    });

    const applyRecoveredMeta = (row) => {
      if (row?.source !== "csvImport" || row?.type !== "income") return row;
      const rec = recoveredByRow.get(String(row.id || ""));
      if (!rec) return row;
      const next = {...row};
      if (typeof rec.paid === "boolean") next.paid = rec.paid;
      if (rec.dateStamp) next.paidAt = rec.paidAt || null;
      else if (rec.paidStamp && rec.paidAtFromPaid !== undefined) next.paidAt = rec.paidAtFromPaid || null;
      if (rec.methodStamp) next.paymentMethod = rec.paymentMethod || "";
      return next;
    };

    const locallyRecovered = ledgerRows.map(applyRecoveredMeta);
    const changed = locallyRecovered.some((r, i) =>
      !!r !== !!ledgerRows[i] ||
      r?.paid !== ledgerRows[i]?.paid ||
      (r?.paidAt || null) !== (ledgerRows[i]?.paidAt || null) ||
      String(r?.paymentMethod || "") !== String(ledgerRows[i]?.paymentMethod || "")
    );
    if (!changed) return false;

    // Read the freshest server rows immediately before writing, then merge ONLY recovered payment fields.
    const ledgerRef = doc(db, "ledgers", currentUser.uid);
    const freshSnap = await getDoc(ledgerRef);
    const freshData = freshSnap.exists() ? freshSnap.data() : {};
    const freshRows = Array.isArray(freshData.rows) ? freshData.rows : [];
    const localById = new Map(locallyRecovered.map(r => [String(r?.id || ""), r]));
    const mergedRows = freshRows.map(serverRow => {
      const local = localById.get(String(serverRow?.id || ""));
      if (!local || serverRow?.source !== "csvImport" || serverRow?.type !== "income") return serverRow;
      return {
        ...serverRow,
        ...(Object.prototype.hasOwnProperty.call(local, "paid") ? {paid: !!local.paid} : {}),
        ...(Object.prototype.hasOwnProperty.call(local, "paidAt") ? {paidAt: local.paidAt || null} : {}),
        ...(Object.prototype.hasOwnProperty.call(local, "paymentMethod") ? {paymentMethod: local.paymentMethod || ""} : {})
      };
    });

    await setDoc(ledgerRef, {rows: mergedRows, rowsUpdatedAt: new Date().toISOString()}, {merge:true});
    ledgerRows = mergedRows;
    return true;
  } catch (err) {
    console.warn("Imported payment audit recovery failed", err);
    return false;
  }
}

async function saveAndVerifyImportedPayments(){
  if (!currentUser?.uid) return;
  const button = document.getElementById("btnSaveVerifyImported");
  const oldText = button?.textContent || "שמור ואמת";
  if (button) { button.disabled = true; button.textContent = "שומר ומאמת…"; }
  try {
    const ledgerRef = doc(db, "ledgers", currentUser.uid);
    const freshSnap = await getDoc(ledgerRef);
    const freshData = freshSnap.exists() ? freshSnap.data() : {};
    const freshRows = Array.isArray(freshData.rows) ? freshData.rows : [];
    const localById = new Map(ledgerRows.filter(r => r?.source === "csvImport" && r?.type === "income").map(r => [String(r.id || ""), r]));

    const mergedRows = freshRows.map(serverRow => {
      const local = localById.get(String(serverRow?.id || ""));
      if (!local || serverRow?.source !== "csvImport" || serverRow?.type !== "income") return serverRow;
      return {
        ...serverRow,
        ...(Object.prototype.hasOwnProperty.call(local, "paid") ? {paid: !!local.paid} : {}),
        ...(Object.prototype.hasOwnProperty.call(local, "paidAt") ? {paidAt: local.paidAt || null} : {}),
        ...(Object.prototype.hasOwnProperty.call(local, "paymentMethod") ? {paymentMethod: local.paymentMethod || ""} : {})
      };
    });

    await setDoc(ledgerRef, {rows: mergedRows, rowsUpdatedAt: new Date().toISOString()}, {merge:true});

    const verifySnap = await getDoc(ledgerRef);
    const verifyRows = Array.isArray(verifySnap.data()?.rows) ? verifySnap.data().rows : [];
    const verifyById = new Map(verifyRows.map(r => [String(r?.id || ""), r]));
    let mismatch = 0;
    for (const [id, local] of localById) {
      const saved = verifyById.get(id);
      if (!saved) { mismatch++; continue; }
      if (Object.prototype.hasOwnProperty.call(local, "paid") && !!saved.paid !== !!local.paid) mismatch++;
      if ((local.paidAt || null) !== (saved.paidAt || null)) mismatch++;
      if (String(local.paymentMethod || "") !== String(saved.paymentMethod || "")) mismatch++;
    }
    if (mismatch) throw new Error(`verification mismatch: ${mismatch}`);

    ledgerRows = verifyRows;
    renderSelected();
    showToast("השינויים נשמרו ואומתו מול השרת.");
  } catch (err) {
    console.error("Save and verify imported payments failed", err);
    showToast("לא ניתן היה לאמת את השמירה. לא לעדכן עוד נתונים לפני בדיקה.", true);
  } finally {
    const btn = document.getElementById("btnSaveVerifyImported");
    if (btn) { btn.disabled = false; btn.textContent = oldText; }
  }
}

async function loadData(){
  if (!currentUser) return;
  saveStatus.textContent = "טוען…";
  userTag.textContent = currentUser.email || "מחובר";

  try {
    const userSnap = await getDoc(doc(db, "users", currentUser.uid));
    userProfile = userSnap.exists() ? userSnap.data() : {};

    const [ledgerSnap, documentsSnap] = await Promise.all([
      getDoc(doc(db, "ledgers", currentUser.uid)),
      getDocs(collection(db, "ledgers", currentUser.uid, "documents"))
    ]);
    const data = ledgerSnap.exists() ? ledgerSnap.data() : {};
    customers = Array.isArray(data.customers) ? data.customers : [];
    ledgerRows = Array.isArray(data.rows) ? data.rows : [];
    const recoveredImportedPayments = await recoverImportedPaymentStatusFromAudit();

    const legacyDocuments = (Array.isArray(data.documents) ? data.documents : []).map(d => ({...d, _storage:"legacy"}));
    const subcollectionDocuments = documentsSnap.docs.map(snapshot => ({
      ...snapshot.data(),
      id: snapshot.data()?.id || snapshot.id,
      _storage:"subcollection"
    }));
    const byId = new Map();
    legacyDocuments.forEach(d => byId.set(String(d.id || `${d.type}-${d.number}`), d));
    subcollectionDocuments.forEach(d => byId.set(String(d.id || `${d.type}-${d.number}`), d));
    ledgerDocuments = Array.from(byId.values());

    saveStatus.textContent = recoveredImportedPayments ? `נטענו ${customers.length} לקוחות · שוחזרו סטטוסי תשלום מיובאים` : `נטענו ${customers.length} לקוחות`;

    // If another page sent us directly to a customer card, open that customer.
    const requestedCustomerId = new URLSearchParams(location.search).get("customerId");
    if (requestedCustomerId && customers.some(c => String(c.id) === String(requestedCustomerId))) {
      selectedId = requestedCustomerId;
    }

    render();
  } catch (err) {
    console.error(err);
    saveStatus.textContent = "שגיאה בטעינת הלקוחות";
    showToast("לא הצלחנו לטעון את הלקוחות", true);
  }
}

});

  if (ev.key === "Escape") {
    closeCustomerSwitcher();
    customerSwitcherInput.blur();
    return;
  }
  if (ev.key === "Enter") {
    const first = customerSwitcherResults?.querySelector("[data-customer-switch-id]");
    if (first) {
      ev.preventDefault();
      switchDirectlyToCustomer(first.dataset.customerSwitchId);
    }
  }
});

  const btn = ev.target.closest("[data-customer-switch-id]");

});

});
