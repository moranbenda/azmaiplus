<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>סגירת שנה - עצמאי פלוס</title>
  <style>
    :root{
      --bg:#f6f8fc; --panel:#fff; --text:#172033; --muted:#667085; --line:#dfe6f0;
      --blue:#2f6fec; --green:#16a34a; --red:#dc2626; --orange:#c47a00; --shadow:0 16px 45px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Heebo",Arial,sans-serif}
    body{direction:rtl}
    a{color:inherit}
    .wrap{max-width:1180px;margin:0 auto;padding:22px}
    header{background:#fff;border-bottom:1px solid var(--line)}
    .top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
    h1{margin:0;font-size:28px;line-height:1.25}
    h2{margin:0 0 14px;font-size:22px}
    h3{margin:0;font-size:17px}
    .hint{color:var(--muted);font-size:13px;line-height:1.5}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
    input,select{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;min-height:42px;font-size:15px;color:var(--text)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:999px;padding:10px 16px;min-height:40px;background:linear-gradient(180deg,#3f7cf1,#2f6fec);color:#fff;text-decoration:none;cursor:pointer;font-size:14px}
    .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
    .btn.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
    .metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 10px 28px rgba(15,23,42,.04)}
    .metric .k{font-size:12px;color:var(--muted)}
    .metric .v{font-size:20px;font-weight:800;margin-top:3px}
    .income{color:var(--green)} .expense{color:var(--red)} .warn{color:var(--orange)}
    .card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
    .card-hd{padding:16px 18px;background:#f1f5fb;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    .card-bd{padding:18px}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{border:1px solid var(--line);padding:10px;text-align:right;vertical-align:top}
    th{background:#f3f6fb;font-weight:700}
    .money{white-space:nowrap;font-variant-numeric:tabular-nums}
    .muted{color:var(--muted)}
    .report-paper{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;max-width:980px;margin:0 auto}
    .report-top{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-bottom:18px;font-size:14px}
    .report-title{font-size:24px;text-align:center;margin:12px 0 20px;font-weight:800}
    .section-title{font-size:18px;font-weight:800;margin:20px 0 8px}
    .total-row td{font-weight:800;background:#fafcff}
    .grand td{font-size:16px;background:#f7fbff}
    .empty{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:850px){
      .wrap{padding:14px}
      h1{font-size:23px}
      .grid{grid-template-columns:1fr 1fr}
      .report-paper{padding:16px}
      .report-top{grid-template-columns:1fr}
      .table-scroll{overflow:auto}
      table{min-width:720px}
    }
    @media print{
      body{background:#fff}
      header,.controls,.nonprint{display:none !important}
      .wrap{max-width:none;padding:0}
      .card{box-shadow:none;border:none;margin:0}
      .card-hd{display:none}
      .card-bd{padding:0}
      .report-paper{border:none;border-radius:0;padding:16px;max-width:none}
      table{min-width:0}
      th,td{padding:7px}
    }
  </style>
</head>
<body>
  <header class="nonprint">
    <div class="wrap top">
      <div>
        <h1>סגירת שנה</h1>
        <div class="hint">רווח והפסד, קבוצות הוצאה והכנה לדוח שנתי.</div>
      </div>
      <div class="row">
        <a class="btn secondary" href="/">חזרה למסך הראשי</a>
        <button class="btn ghost" id="btnRefresh" type="button">רענון נתונים</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="card controls">
      <div class="card-hd"><h3>בחירת שנת מס</h3><span class="hint" id="statusText">טוען נתונים…</span></div>
      <div class="card-bd">
        <div class="row">
          <div>
            <label>שנת מס</label>
            <select id="taxYear"></select>
          </div>
          <div>
            <label>פחת לשנה</label>

          </div>

          <button class="btn secondary" type="button" id="btnCsv">ייצוא CSV</button>
        </div>
      </div>
    </section>

    <section class="grid controls" id="metricsGrid">
      <div class="metric"><div class="k">הכנסות ללא מע״מ</div><div class="v income" id="mIncome">₪ 0.00</div></div>
      <div class="metric"><div class="k">הוצאות מוכרות למס</div><div class="v expense" id="mExpenses">₪ 0.00</div></div>
      <div class="metric"><div class="k">פחת</div><div class="v warn" id="mDep">₪ 0.00</div></div>

    <section class="card controls">

        <table>
          <thead><tr><th>קבוצה</th><th>קטגוריה</th><th>סכום מוכר למס</th><th>כולל</th><th>מע״מ תשומות</th></tr></thead>
          <tbody id="groupsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="pnlCard">
      <div class="card-hd nonprint"><h3>דוח רווח והפסד</h3></div>
      <div class="card-bd">
        <div class="report-paper" id="pnlReport"></div>
      </div>
    </section>
  </main>

<script type="module">

const EXPENSE_ITEMS = [

    category: "חומרי ניקוי",           incomeTaxPct: 100, vatAllowed: true  },

  { item: "כלים חד פעמיים",            category: "כלים חד פעמיים",              incomeTaxPct: 80,  vatAllowed: true  },

  { item: "קורסים, ספרים, אתרים",      category: "ספרות מקצועית",              incomeTaxPct: 100, vatAllowed: true  },
  { item: "כנסים והשתלמויות",          category: "כנסים והשתלמויות",            incomeTaxPct: 100, vatAllowed: true  },

  { item: "ביגוד",                     category: "ביגוד ממותג בלבד",             incomeTaxPct: 100, vatAllowed: true  },

  { item: "תרומות לעמותות מוכרות",    category: "תרומות",                       incomeTaxPct: 35,  vatAllowed: false },
  { item: "קרן השתלמות",              category: "קרן השתלמות",                 incomeTaxPct: 0,   vatAllowed: false },
  { item: "ביטוח לאומי",              category: "תשלומי חובה",                  incomeTaxPct: 100, vatAllowed: false },

  { item: "שטיפת רכב ותחזוקה שוטפת",  category: "רכב",                          incomeTaxPct: 45,  vatAllowed: true  },

  { item: "ציוד (כללי)",                 category: "ציוד",                         incomeTaxPct: 100, vatAllowed: true  },
  { item: "קבלני משנה / שירותים חיצוניים", category: "שירותים חיצוניים וקבלני משנה", incomeTaxPct: 100, vatAllowed: true  }
];

const taxYear = document.getElementById('taxYear');
const depreciationInput = document.getElementById('depreciationInput');
const statusText = document.getElementById('statusText');
const groupsBody = document.getElementById('groupsBody');
const pnlReport = document.getElementById('pnlReport');
const mIncome = document.getElementById('mIncome');
const mExpenses = document.getElementById('mExpenses');
const mDep = document.getElementById('mDep');
const mProfit = document.getElementById('mProfit');

let currentUser = null;
let userProfile = null;
let rows = [];
let ledgerSettings = { vatEnabled: true, vatRate: DEFAULT_VAT };

function escapeHtml(s=''){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}
function toMoney(n){
  const x = Number(n) || 0;
  return new Intl.NumberFormat('he-IL', { style:'currency', currency:'ILS', minimumFractionDigits:2 }).format(x);
}
function csvCell(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadFile(name, content, type='text/csv;charset=utf-8'){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}
function normalizeBusinessType(value) {
  const v = String(value || '').trim().toLowerCase();
  if (!v) return 'morasha';
  if (v === 'ptor') return 'ptor';
  if (v === 'morasha' || v === 'osek' || v === 'osek_morshe' || v === 'osek_murashe') return 'morasha';
  if (v === 'hevra' || v === 'company') return 'hevra';
  return 'morasha';
}
function getEffectiveVatRate(baseRate) {
  const n = parseFloat(baseRate);
  return Number.isFinite(n) && n > 0 ? n : DEFAULT_VAT;
}
function getSettings() {
  const type = normalizeBusinessType(userProfile?.businessType);
  const rate = getEffectiveVatRate(ledgerSettings?.vatRate || userProfile?.vatRate || DEFAULT_VAT);
  return { vatEnabled: type === 'ptor' ? false : ledgerSettings?.vatEnabled !== false, vatRate: type === 'ptor' ? 0 : rate };
}
function splitVAT(amount, incVat, rate) {
  const n = Number(amount) || 0;
  const r = (Number(rate) || 0) / 100;
  if (!r) return { net: n, vat: 0, gross: n };
  if (incVat) {
    const net = n / (1 + r);
    return { net, vat: n - net, gross: n };
  }
  const vat = n * r;
  return { net: n, vat, gross: n + vat };
}
function normalizeExpenseText(s) {
  return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
}
function getExpenseMeta(row) {
  if (!row) return null;
  const categoryKey = normalizeExpenseText(row.category || '');
  const descKey = normalizeExpenseText(row.desc || '');
  let match = EXPENSE_ITEMS.find(item => normalizeExpenseText(item.item) === categoryKey);
  if (match) return match;
  match = EXPENSE_ITEMS.find(item => normalizeExpenseText(item.category) === categoryKey);
  if (match) return match;
  match = EXPENSE_ITEMS.find(item => categoryKey && categoryKey.includes(normalizeExpenseText(item.item)));
  if (match) return match;
  match = EXPENSE_ITEMS.find(item => descKey && descKey.includes(normalizeExpenseText(item.item)));
  return match || null;
}
function getRecognitionPctForRow(row) {
  const meta = getExpenseMeta(row);
  const pct = meta ? meta.incomeTaxPct : (row?.deductPct ?? 100);
  return Math.max(0, Math.min(100, Number(pct) || 0)) / 100;
}
function getVatDeductibleFactorForRow(row) {
  const meta = getExpenseMeta(row);
  if (meta) return meta.vatAllowed ? 1 : 0;
  return Math.max(0, Math.min(100, Number(row?.deductPct ?? 100) || 0)) / 100;
}
function getTaxDeductibleExpenseAmount(row, amounts) {
  if (!row || row.type !== 'expense') return 0;
  const meta = getExpenseMeta(row);
  const pct = getRecognitionPctForRow(row);
  const resolved = amounts || splitVAT(row.amount, row.incVat, getSettings().vatEnabled ? getSettings().vatRate : 0);
  const base = meta ? (meta.vatAllowed ? resolved.net : resolved.gross) : resolved.net;
  return base * pct;
}
function depKey(){ return `yearEndDepV1_${currentUser?.uid || 'anon'}_${taxYear.value}`; }
function loadDep(){ depreciationInput.value = localStorage.getItem(depKey()) || ''; }
function saveDep(){ if (currentUser) localStorage.setItem(depKey(), depreciationInput.value || '0'); }
function yearsFromRows(){
  const set = new Set(rows.map(r => String(r.date || '').slice(0,4)).filter(y => /^\d{4}$/.test(y)));
  const now = new Date().getFullYear(); set.add(String(now)); set.add(String(now-1));
  return Array.from(set).sort((a,b)=>b.localeCompare(a));
}
function pnlGroupForCategory(category, item){
  const c = String(category || '');
  const i = String(item || '');
  const t = `${c} ${i}`;
  if (/רכב|חנייה|מוסך|דלק|ביטוח.*רכב/.test(t)) return 'vehicle';
  if (/ביתיות|חומרי ניקוי|כלים חד פעמיים|שכירות משרד|חדר עבודה/.test(t)) return 'homeOffice';
  if (/ביגוד/.test(t)) return 'professional';
  if (/כיבוד|נסיעות בתחבורה|אש.?ל|תרומות/.test(t)) return 'other';
  return 'admin';
}
const GROUP_TITLES = {
  admin: 'הוצאות הנהלה וכלליות',
  vehicle: 'הוצאות רכב ואחזקה',
  homeOffice: 'אחזקת משרד / הוצאות ביתיות',
  professional: 'הוצאות מקצועיות',
  other: 'הוצאות אחרות / שונות'
};
const GROUP_ORDER = ['admin','vehicle','homeOffice','professional','other'];

function calculateYear(){
  const year = taxYear.value;
  const settings = getSettings();
  const list = rows.filter(r => String(r.date || '').slice(0,4) === year);
  let incomeNet = 0;
  let incomeGross = 0;
  let incomeVat = 0;
  let totalDeductible = 0;
  let totalGrossExpenses = 0;
  let totalInputVat = 0;
  const groups = {};
  for (const g of GROUP_ORDER) groups[g] = { title: GROUP_TITLES[g], categories: new Map(), total:0, gross:0, vat:0 };

  for (const r of list) {
    const amounts = splitVAT(r.amount, r.incVat, settings.vatEnabled ? settings.vatRate : 0);
    if (r.type === 'income') {
      incomeNet += amounts.net;
      incomeGross += amounts.gross;
      incomeVat += amounts.vat;
      continue;
    }
    if (r.type !== 'expense') continue;
    const meta = getExpenseMeta(r);
    const categoryName = meta?.category || r.category || 'לא מסווג';
    const itemName = meta?.item || r.category || r.desc || categoryName;
    const deductible = getTaxDeductibleExpenseAmount(r, amounts);
    const inputVat = amounts.vat * getVatDeductibleFactorForRow(r);
    if (Math.abs(deductible) < 0.005 && Math.abs(amounts.gross) < 0.005) continue;
    const groupKey = pnlGroupForCategory(categoryName, itemName);
    const group = groups[groupKey] || groups.admin;
    const prev = group.categories.get(categoryName) || { deductible:0, gross:0, vat:0 };
    prev.deductible += deductible;
    prev.gross += amounts.gross;
    prev.vat += inputVat;
    group.categories.set(categoryName, prev);
    group.total += deductible;
    group.gross += amounts.gross;
    group.vat += inputVat;
    totalDeductible += deductible;
    totalGrossExpenses += amounts.gross;
    totalInputVat += inputVat;
  }
  const depreciation = Math.max(0, Number(depreciationInput.value) || 0);
  const totalExpenses = totalDeductible + depreciation;
  const operatingProfit = incomeNet - totalExpenses;
  return { year, list, incomeNet, incomeGross, incomeVat, groups, totalDeductible, totalGrossExpenses, totalInputVat, depreciation, totalExpenses, operatingProfit };
}
function renderGroups(calc){
  const rowsHtml = [];
  for (const key of GROUP_ORDER) {
    const g = calc.groups[key];
    if (!g || Math.abs(g.total) < 0.005) continue;
    const cats = Array.from(g.categories.entries()).sort((a,b)=> b[1].deductible - a[1].deductible);
    for (const [cat, vals] of cats) {
      rowsHtml.push(`<tr><td>${escapeHtml(g.title)}</td><td>${escapeHtml(cat)}</td><td class="money">${toMoney(vals.deductible)}</td><td class="money">${toMoney(vals.gross)}</td><td class="money">${toMoney(vals.vat)}</td></tr>`);
    }
    rowsHtml.push(`<tr class="total-row"><td colspan="2">סה״כ ${escapeHtml(g.title)}</td><td class="money">${toMoney(g.total)}</td><td class="money">${toMoney(g.gross)}</td><td class="money">${toMoney(g.vat)}</td></tr>`);
  }
  groupsBody.innerHTML = rowsHtml.join('') || `<tr><td colspan="5" class="empty">אין הוצאות לשנה שנבחרה</td></tr>`;
}
function renderPnl(calc){
  const businessName = userProfile?.businessName || 'שם העסק';
  const displayName = userProfile?.displayName || userProfile?.email || currentUser?.email || '';
  const businessId = userProfile?.businessId || '';
  const sections = [];
  sections.push(`<div class="section-title">הכנסות</div><table><tbody><tr><td>הכנסה ממכירות</td><td class="money">${toMoney(calc.incomeNet)}</td></tr><tr class="total-row"><td>סה״כ הכנסות</td><td class="money">${toMoney(calc.incomeNet)}</td></tr></tbody></table>`);
  for (const key of GROUP_ORDER) {
    const g = calc.groups[key];
    if (!g || Math.abs(g.total) < 0.005) continue;
    const lines = Array.from(g.categories.entries()).sort((a,b)=> b[1].deductible - a[1].deductible)
      .map(([cat, vals]) => `<tr><td>${escapeHtml(cat)}</td><td class="money">${toMoney(vals.deductible)}</td></tr>`).join('');
    sections.push(`<div class="section-title">${escapeHtml(g.title)}</div><table><tbody>${lines}<tr class="total-row"><td>סה״כ ${escapeHtml(g.title)}</td><td class="money">${toMoney(g.total)}</td></tr></tbody></table>`);
  }
  sections.push(`<div class="section-title">פחת</div><table><tbody><tr><td>פחת</td><td class="money">${toMoney(calc.depreciation)}</td></tr><tr class="total-row"><td>סה״כ פחת</td><td class="money">${toMoney(calc.depreciation)}</td></tr></tbody></table>`);
  pnlReport.innerHTML = `
    <div class="report-top">
      <div><strong>שם:</strong> ${escapeHtml(displayName)}</div>
      <div><strong>שם העסק:</strong> ${escapeHtml(businessName)}</div>
      <div><strong>מספר עוסק / ח.פ:</strong> ${escapeHtml(businessId || '-')}</div>
      <div><strong>שנת המס:</strong> ${escapeHtml(calc.year)}</div>
    </div>
    <div class="report-title">דוח רווח והפסד לשנת ${escapeHtml(calc.year)}</div>
    ${sections.join('')}
    <table style="margin-top:20px"><tbody>
      <tr class="grand"><td>סה״כ הוצאות</td><td class="money">${toMoney(calc.totalExpenses)}</td></tr>
      <tr class="grand"><td>סה״כ רווח תפעולי</td><td class="money">${toMoney(calc.operatingProfit)}</td></tr>
    </tbody></table>
    <div class="hint" style="margin-top:12px">לחודשים ינואר עד דצמבר — לא כולל מע״מ</div>
  `;
}
function renderAll(){
  const calc = calculateYear();
  mIncome.textContent = toMoney(calc.incomeNet);
  mExpenses.textContent = toMoney(calc.totalDeductible);
  mDep.textContent = toMoney(calc.depreciation);
  mProfit.textContent = toMoney(calc.operatingProfit);
  mProfit.style.color = calc.operatingProfit >= 0 ? 'var(--green)' : 'var(--red)';
  renderGroups(calc);
  renderPnl(calc);
  statusText.textContent = `${calc.list.length} תנועות בשנת ${calc.year}`;
}
function exportPnlCsv(){
  const calc = calculateYear();
  const lines = [['סעיף','קבוצה','סכום'].map(csvCell).join(',')];
  lines.push(['הכנסות','הכנסה ממכירות',calc.incomeNet].map(csvCell).join(','));
  for (const key of GROUP_ORDER) {
    const g = calc.groups[key];
    if (!g || Math.abs(g.total) < 0.005) continue;
    for (const [cat, vals] of g.categories.entries()) lines.push(['הוצאה', `${g.title} - ${cat}`, vals.deductible].map(csvCell).join(','));
    lines.push(['סה״כ', g.title, g.total].map(csvCell).join(','));
  }
  lines.push(['פחת','פחת',calc.depreciation].map(csvCell).join(','));
  lines.push(['סה״כ הוצאות','',calc.totalExpenses].map(csvCell).join(','));
  lines.push(['רווח תפעולי','',calc.operatingProfit].map(csvCell).join(','));
  downloadFile(`דוח-רווח-והפסד-${calc.year}.csv`, lines.join('\n'));
}
async function loadData(user){
  currentUser = user;
  statusText.textContent = 'טוען נתונים…';
  const [userSnap, ledgerSnap] = await Promise.all([
    getDoc(doc(db, 'users', user.uid)),
    getDoc(doc(db, 'ledgers', user.uid))
  ]);
  userProfile = userSnap.exists() ? userSnap.data() : { email: user.email };
  const ledger = ledgerSnap.exists() ? ledgerSnap.data() : {};
  rows = Array.isArray(ledger.rows) ? ledger.rows : [];
  ledgerSettings = ledger.settings || { vatEnabled: true, vatRate: userProfile?.vatRate || DEFAULT_VAT };
  const years = yearsFromRows();
  const current = taxYear.value;
  taxYear.innerHTML = years.map(y => `<option value="${escapeHtml(y)}">${escapeHtml(y)}</option>`).join('');
  taxYear.value = years.includes(current) ? current : years[0];
  loadDep();
  renderAll();
}

taxYear.addEventListener('change', () => { loadDep(); renderAll(); });
depreciationInput.addEventListener('input', () => { saveDep(); renderAll(); });
document.getElementById('btnPrint').addEventListener('click', () => window.print());
document.getElementById('btnCsv').addEventListener('click', exportPnlCsv);
document.getElementById('btnRefresh').addEventListener('click', () => currentUser && loadData(currentUser));

onAuthStateChanged(auth, async user => {
  try {
    if (!user) {
      statusText.innerHTML = 'יש להתחבר דרך האפליקציה הראשית כדי לראות נתונים.';
      pnlReport.innerHTML = '<div class="empty">לא מחוברים. חזרה למסך הראשי תאפשר התחברות.</div>';
      return;
    }
    await loadData(user);
  } catch (err) {
    console.error(err);
    statusText.textContent = 'שגיאה בטעינת הנתונים';
    pnlReport.innerHTML = '<div class="empty">שגיאה בטעינת הנתונים. כדאי לבדוק Console.</div>';
  }
});
</script>
