<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עצמאי פלוס - מנהל חשבונות</title>
  <style>
    :root{--bg:#f4f7ff;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#2f6fed;--border:#e2e8f0;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Heebo,Arial,sans-serif;background:linear-gradient(180deg,#ffffff,#f6f8ff 40%,#eef2f7 100%);color:var(--text);}
    .wrap{max-width:1100px;margin:0 auto;padding:24px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 30px rgba(2,6,23,.08);}
    .auth{max-width:520px;margin:60px auto;padding:28px;}
    h1{margin:0 0 8px;font-size:24px;}
    p{margin:0 0 18px;color:var(--muted);}
    .tabs{display:flex;background:#f1f5ff;border-radius:999px;padding:6px;gap:6px;margin:16px 0 18px;}
    .tab{flex:1;border:0;background:transparent;padding:10px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;}
    .tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 10px rgba(2,6,23,.08);}
    label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;}
    input,select,textarea{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:12px;padding:12px 12px;font-size:15px;background:#fff;}
    textarea{min-height:80px;resize:vertical;}
    .btn{width:100%;border:0;border-radius:999px;background:var(--primary);color:#fff;padding:12px 14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px;}
    .btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--border);}
    .row{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;}
    .row > div{grid-column:span 12;}
    @media(min-width:900px){
      .row .c3{grid-column:span 3;}
      .row .c4{grid-column:span 4;}
      .row .c2{grid-column:span 2;}
      .row .c6{grid-column:span 6;}
    }
    .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .pill{display:inline-flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 12px;}
    .linkbtn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--text);}
    .linkbtn.primary{background:var(--primary);color:#fff;border:0;}
    .muted{color:var(--muted);font-size:13px;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:10px;border-bottom:1px solid var(--border);text-align:right;font-size:14px;vertical-align:top;}
    th{color:var(--muted);font-weight:700;background:#fafcff;position:sticky;top:0;}
    .pos{color:#059669;font-weight:700;}
    .neg{color:#b91c1c;font-weight:700;}
    .right{text-align:left;}
    .actions button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;}
    .hide{display:none !important;}
    .error{color:#b91c1c;margin-top:10px;font-size:13px;}
  </style>
</head>
<body>
  <div id="authScreen" class="wrap">
    <div class="card auth">
      <h1>התחברות לעצמאי פלוס</h1>
      <p>יש להתחבר כדי להשתמש במערכת.</p>
      <div class="tabs">
        <button id="tabLogin" class="tab active">התחברות</button>
        <button id="tabRegister" class="tab">הרשמה</button>
      </div>

      <div id="loginPane">
        <label for="loginEmail">אימייל</label>
        <input id="loginEmail" type="email" autocomplete="email" />
        <label for="loginPassword">סיסמה</label>
        <input id="loginPassword" type="password" autocomplete="current-password" />
        <button id="btnLogin" class="btn">התחברות</button>
      </div>

      <div id="registerPane" class="hide">
        <label for="regEmail">אימייל</label>
        <input id="regEmail" type="email" autocomplete="email" />
        <label for="regPassword">סיסמה</label>
        <input id="regPassword" type="password" autocomplete="new-password" />
        <button id="btnRegister" class="btn">הרשמה</button>
      </div>

      <div id="authError" class="error hide"></div>
      <button id="btnSupport" class="btn secondary" type="button" style="margin-top:14px;">פנייה למפתח</button>
      <div class="muted" style="margin-top:10px;">* תיפתח הודעת Gmail חדשה.</div>
    </div>
  </div>

  <div id="appScreen" class="wrap hide">
    <div class="topbar">
      <div class="pill">
        <strong id="userEmail">—</strong>
        <span class="muted" id="syncState">שמירה: מקומית + ענן</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button id="btnExportCSV" class="linkbtn">ייצוא CSV</button>
        <button id="btnLogout" class="linkbtn">התנתקות</button>
      </div>
    </div>

    <div class="card" style="padding:18px;">
      <h2 style="margin:0 0 10px;font-size:18px;">הוספת הכנסה / הוצאה</h2>
      <div class="row">
        <div class="c3">
          <label for="fDate">תאריך</label>
          <input id="fDate" type="date" />
        </div>
        <div class="c3">
          <label for="fType">סוג</label>
          <select id="fType">
            <option value="income">הכנסה</option>
            <option value="expense">הוצאה</option>
          </select>
        </div>
        <div class="c3">
          <label for="fCategory">קטגוריה</label>
          <input id="fCategory" placeholder="למשל: פרסום / שכירות" />
        </div>
        <div class="c3">
          <label for="fAmount">סכום (₪)</label>
          <input id="fAmount" inputmode="decimal" placeholder="0" />
        </div>
        <div class="c6">
          <label for="fDesc">תיאור</label>
          <input id="fDesc" placeholder="מה זה היה?" />
        </div>
        <div class="c2" style="display:flex;align-items:end;">
          <button id="btnAdd" class="btn" style="margin:0;">הוספה</button>
        </div>
      </div>

      <div class="row" style="margin-top:14px;">
        <div class="c4">
          <div class="pill" style="width:100%;justify-content:space-between;">
            <span class="muted">הכנסות</span>
            <span id="sumIncome" class="pos">₪ 0</span>
          </div>
        </div>
        <div class="c4">
          <div class="pill" style="width:100%;justify-content:space-between;">
            <span class="muted">הוצאות</span>
            <span id="sumExpense" class="neg">₪ 0</span>
          </div>
        </div>
        <div class="c4">
          <div class="pill" style="width:100%;justify-content:space-between;">
            <span class="muted">רווח</span>
            <span id="sumProfit" style="font-weight:800;">₪ 0</span>
          </div>
        </div>
      </div>

      <div style="margin-top:14px;border:1px solid var(--border);border-radius:14px;overflow:auto;max-height:420px;">
        <table>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>סוג</th>
              <th>קטגוריה</th>
              <th>תיאור</th>
              <th>סכום</th>
              <th class="right">פעולות</th>
            </tr>
          </thead>
          <tbody id="rowsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, onAuthStateChanged,
      signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDtMcQNNvB65mhzmSVO1hkQ2Z3Snp-uITE",
  authDomain: "freelance-accounting-6c3bb.firebaseapp.com",
  projectId: "freelance-accounting-6c3bb",
  storageBucket: "freelance-accounting-6c3bb.firebasestorage.app",
  messagingSenderId: "196974556694",
  appId: "1:196974556694:web:60ba710567f2a7c67c6737"
};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // UI
    const authScreen = document.getElementById("authScreen");
    const appScreen = document.getElementById("appScreen");
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginPane = document.getElementById("loginPane");
    const registerPane = document.getElementById("registerPane");
    const authError = document.getElementById("authError");

    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const regEmail = document.getElementById("regEmail");
    const regPassword = document.getElementById("regPassword");

    const btnLogin = document.getElementById("btnLogin");
    const btnRegister = document.getElementById("btnRegister");
    const btnSupport = document.getElementById("btnSupport");

    const userEmail = document.getElementById("userEmail");
    const syncState = document.getElementById("syncState");
    const btnLogout = document.getElementById("btnLogout");
    const btnExportCSV = document.getElementById("btnExportCSV");

    const fDate = document.getElementById("fDate");
    const fType = document.getElementById("fType");
    const fCategory = document.getElementById("fCategory");
    const fDesc = document.getElementById("fDesc");
    const fAmount = document.getElementById("fAmount");
    const btnAdd = document.getElementById("btnAdd");

    const rowsBody = document.getElementById("rowsBody");
    const sumIncome = document.getElementById("sumIncome");
    const sumExpense = document.getElementById("sumExpense");
    const sumProfit = document.getElementById("sumProfit");

    // mailto support
    btnSupport.onclick = () => {
      window.location.href = "mailto:azmaiplusapp@gmail.com?subject=" +
        encodeURIComponent("פנייה למפתח - AzmaiPlus") +
        "&body=" + encodeURIComponent("שלום,\n\nתיאור הבעיה/בקשה:\n");
    };

    function showAuthError(msg) {
      authError.textContent = msg;
      authError.classList.remove("hide");
    }
    function clearAuthError() {
      authError.classList.add("hide");
      authError.textContent = "";
    }

    tabLogin.onclick = () => {
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      loginPane.classList.remove("hide");
      registerPane.classList.add("hide");
      clearAuthError();
    };
    tabRegister.onclick = () => {
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      registerPane.classList.remove("hide");
      loginPane.classList.add("hide");
      clearAuthError();
    };

    btnLogin.onclick = async () => {
      clearAuthError();
      try {
        await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
      } catch (e) {
        console.error(e);
        showAuthError("לא ניתן להתחבר. בדקי אימייל/סיסמה או מצב Firebase.");
      }
    };
    btnRegister.onclick = async () => {
      clearAuthError();
      try {
        await createUserWithEmailAndPassword(auth, regEmail.value.trim(), regPassword.value);
      } catch (e) {
        console.error(e);
        showAuthError("לא ניתן להירשם. בדקי סיסמה/אימייל או מצב Firebase.");
      }
    };

    btnLogout.onclick = async () => {
      await signOut(auth);
    };

    function todayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${yyyy}-${mm}-${dd}`;
    }

    let currentUid = null;
    let rows = [];

    function money(n) {
      try {
        return new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS" }).format(n || 0);
      } catch {
        return "₪ " + (n||0).toFixed(2);
      }
    }

    function render() {
      rowsBody.innerHTML = "";
      let inc=0, exp=0;
      for (const r of rows) {
        const tr = document.createElement("tr");
        const typeLabel = r.type === "income" ? "הכנסה" : "הוצאה";
        const amount = Number(r.amount)||0;
        if (r.type === "income") inc += amount; else exp += amount;

        tr.innerHTML = `
          <td>${r.date || ""}</td>
          <td>${typeLabel}</td>
          <td>${escapeHtml(r.category || "")}</td>
          <td>${escapeHtml(r.desc || "")}</td>
          <td class="${r.type === "income" ? "pos" : "neg"}">${money(amount)}</td>
          <td class="right actions">
            <button data-id="${r.id}" data-act="del">מחק</button>
          </td>
        `;
        rowsBody.appendChild(tr);
      }
      sumIncome.textContent = money(inc);
      sumExpense.textContent = money(exp);
      sumProfit.textContent = money(inc - exp);
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function localKey(uid) { return `azmaiplus_rows_${uid}`; }

    function loadLocal(uid) {
      try {
        const raw = localStorage.getItem(localKey(uid));
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveLocal(uid, data) {
      try {
        localStorage.setItem(localKey(uid), JSON.stringify(data));
      } catch {}
    }

    async function loadCloud(uid) {
      const ref = doc(db, "users", uid, "app", "ledger");
      const snap = await getDoc(ref);
      if (!snap.exists()) return null;
      const data = snap.data();
      return Array.isArray(data.rows) ? data.rows : [];
    }

    async function saveCloud(uid, data) {
      const ref = doc(db, "users", uid, "app", "ledger");
      await setDoc(ref, { rows: data, updatedAt: Date.now() }, { merge: true });
    }

    let cloudTimer = null;
    function scheduleCloudSave() {
      if (!currentUid) return;
      syncState.textContent = "שמירה: מעדכן ענן…";
      clearTimeout(cloudTimer);
      cloudTimer = setTimeout(async () => {
        try {
          await saveCloud(currentUid, rows);
          syncState.textContent = "שמירה: מקומית + ענן";
        } catch (e) {
          console.error(e);
          syncState.textContent = "שמירה: מקומית (ענן נכשל)";
        }
      }, 600);
    }

    btnAdd.onclick = () => {
      try {
        const date = fDate.value || todayISO();
        const type = fType.value;
        const category = (fCategory.value || "").trim();
        const desc = (fDesc.value || "").trim();
        const amount = parseFloat(String(fAmount.value).replace(/,/g,"").replace(/₪/g,"").trim());
        if (!type || !isFinite(amount) || amount <= 0) {
          alert("נא למלא סכום תקין (>0) ולבחור סוג.");
          return;
        }
        const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "_" + Math.random().toString(16).slice(2);
        rows.unshift({ id, date, type, category, desc, amount });
        saveLocal(currentUid, rows);
        scheduleCloudSave();
        render();
        // reset
        fAmount.value = "";
        fDesc.value = "";
        fCategory.value = "";
      } catch (e) {
        console.error(e);
        alert("שגיאה בהוספה - בדקי Console");
      }
    };

    rowsBody.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const id = btn.getAttribute("data-id");
      const act = btn.getAttribute("data-act");
      if (act === "del") {
        rows = rows.filter(r => r.id !== id);
        saveLocal(currentUid, rows);
        scheduleCloudSave();
        render();
      }
    });

    btnExportCSV.onclick = () => {
      const headers = ["date","type","category","desc","amount"];
      const lines = [headers.join(",")];
      for (const r of rows) {
        const vals = headers.map(h => {
          const v = r[h] ?? "";
          const s = String(v).replaceAll('"','""');
          return `"${s}"`;
        });
        lines.push(vals.join(","));
      }
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "azmaiplus-ledger.csv";
      a.click();
      URL.revokeObjectURL(url);
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        currentUid = null;
        authScreen.classList.remove("hide");
        appScreen.classList.add("hide");
        return;
      }
      currentUid = user.uid;
      userEmail.textContent = user.email || "מחובר";
      authScreen.classList.add("hide");
      appScreen.classList.remove("hide");
      fDate.value = todayISO();

      // Load: prefer cloud; fallback local
      rows = loadLocal(currentUid);
      try {
        const cloud = await loadCloud(currentUid);
        if (cloud && cloud.length) {
          rows = cloud;
          saveLocal(currentUid, rows);
        }
      } catch (e) {
        console.warn("cloud load failed", e);
      }
      render();
    });
  </script>
</body>
</html>
