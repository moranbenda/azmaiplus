<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עצמאי פלוס - ניהול חשבונות</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root{
      --bg:#f0f2f5; --panel:#ffffff; --text:#1c1e21; --text-dim:#606770;
      --accent:#2f6fec; --accent-hover:#1a56cc; --good:#00a400; --bad:#fa383e;
      --line:#dddfe2; --radius:12px; --shadow:0 12px 28px 0 rgba(0,0,0,0.1);
    }
    *{box-sizing:border-box}
    body{ margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; height: 100vh; }
    .wrap{ max-width:1300px; margin:0 auto; padding:20px; }
    
    header{ background:#fff; border-bottom:1px solid var(--line); padding:12px 0; position:sticky; top:0; z-index:100; }
    .nav-flex{ display:flex; justify-content:space-between; align-items:center; }
    .logo{ font-size:22px; font-weight:800; color:var(--accent); text-decoration:none; }
    
    .card{ background:var(--panel); border-radius:var(--radius); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:20px; }
    .card-hd{ padding:15px 20px; border-bottom:1px solid var(--line); font-weight:700; display:flex; justify-content:space-between; background:#f5f6f7; border-radius:12px 12px 0 0; }
    .card-bd{ padding:20px; }
    
    .btn{ cursor:pointer; padding:10px 16px; border-radius:8px; border:none; font-weight:600; transition:0.2s; display:inline-flex; align-items:center; gap:6px; font-size: 14px; }
    .btn-p{ background:var(--accent); color:#fff; }
    .btn-s{ background:#f0f2f5; color:var(--text); }
    .btn-danger{ background:#ffebe9; color:var(--bad); }

    .form-group{ margin-bottom:12px; }
    label{ display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:var(--text-dim); }
    input, select{ width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); font-size:14px; }

    /* Login Styles */
    #authOverlay { position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; align-items:center; justify-content:center; }
    .auth-box { background:#fff; padding:40px; border-radius:20px; box-shadow:var(--shadow); width:90%; max-width:400px; }
    .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
    .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 600; color: var(--text-dim); }
    .auth-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

    .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:20px; }
    .stat-box { background:#fff; padding:20px; border-radius:12px; border:1px solid var(--line); text-align:center; }
    .stat-val { font-size:20px; font-weight:800; display:block; margin-top:5px; }

    .grid { display:grid; grid-template-columns: 380px 1fr; gap:20px; }
    @media (max-width: 1000px){ .grid{ grid-template-columns: 1fr; } }

    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:right; padding:12px; background:#f5f6f7; border-bottom:2px solid var(--line); }
    td { padding:12px; border-bottom:1px solid var(--line); }
    
    dialog { border:none; border-radius:16px; padding:0; width:min(500px, 90vw); box-shadow:var(--shadow); }
    .dlg-h { padding:15px; background:#f5f6f7; border-bottom:1px solid var(--line); font-weight:700; display:flex; justify-content:space-between; }
    .dlg-b { padding:20px; }
  </style>
</head>
<body>

<div id="authOverlay">
  <div class="auth-box">
    <h2 style="text-align:center; color:var(--accent); margin-top:0">עצמאי פלוס</h2>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="showAuth('login')">התחברות</div>
      <div class="auth-tab" id="tabSignup" onclick="showAuth('signup')">הרשמה</div>
    </div>

    <form id="loginForm">
      <div class="form-group"><label>אימייל</label><input type="email" id="loginEmail" required></div>
      <div class="form-group"><label>סיסמה</label><input type="password" id="loginPass" required></div>
      <button type="submit" class="btn btn-p" style="width:100%">כניסה למערכת</button>
    </form>

    <form id="signupForm" style="display:none">
      <div class="form-group"><label>אימייל</label><input type="email" id="signupEmail" required></div>
      <div class="form-group"><label>סיסמה (לפחות 6 תווים)</label><input type="password" id="signupPass" required></div>
      <button type="submit" class="btn btn-p" style="width:100%">הרשמה ופתיחת חשבון</button>
    </form>
    <p id="authError" style="color:var(--bad); font-size:12px; text-align:center; margin-top:10px"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap nav-flex">
      <div class="logo">עצמאי פלוס</div>
      <div style="display:flex; gap:10px">
        <button class="btn btn-s" id="btnSettings">⚙️ הגדרות עסק</button>
        <button class="btn btn-s" onclick="openSupport()">💬 תמיכה</button>
        <button class="btn btn-danger" onclick="logout()">יציאה</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="stats">
      <div class="stat-box">הכנסות (נטו)<span class="stat-val" id="sInc" style="color:var(--good)">₪0</span></div>
      <div class="stat-box">הוצאות מוכרות<span class="stat-val" id="sExp" style="color:var(--bad)">₪0</span></div>
      <div class="stat-box">מע"מ (לתשלום/החזר)<span class="stat-val" id="sVat">₪0</span></div>
      <div class="stat-box">רווח נקי (לפני מס)<span class="stat-val" id="sNet" style="color:var(--accent)">₪0</span></div>
    </div>

    <div class="grid">
      <section class="card">
        <div class="card-hd">הוספת תנועה חדשה</div>
        <div class="card-bd">
          <form id="txForm">
            <div class="form-group"><label>תאריך</label><input type="date" id="fDate" required></div>
            <div class="form-group">
              <label>סוג</label>
              <select id="fType"><option value="income">הכנסה</option><option value="expense">הוצאה</option></select>
            </div>
            <div class="form-group"><label>קטגוריה</label><select id="fCat"></select></div>
            <div class="form-group"><label>תיאור</label><input type="text" id="fDesc" placeholder="שם ספק/לקוח" required></div>
            <div class="form-group"><label>סכום כולל (₪)</label><input type="number" step="0.01" id="fSum" required></div>
            <button type="submit" class="btn btn-p" style="width:100%">שמירה</button>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="card-hd">
          פירוט תנועות
          <div style="display:flex; gap:10px">
            <input type="month" id="filterMonth">
            <button class="btn btn-s" id="btnExport">📥 ייצוא</button>
          </div>
        </div>
        <div class="card-bd" style="overflow-x:auto">
          <table id="txTable">
            <thead>
              <tr>
                <th>תאריך</th>
                <th>תיאור / קטגוריה</th>
                <th>סה"כ</th>
                <th>מע"מ מוכר</th>
                <th>מוכר למס</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="txBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<dialog id="dlgSettings">
  <div class="dlg-h">הגדרות עסק <button class="btn" onclick="this.closest('dialog').close()">X</button></div>
  <div class="dlg-b">
    <div class="form-group"><label>שם העסק</label><input type="text" id="pName"></div>
    <div class="form-group"><label>ח.פ / עוסק</label><input type="text" id="pId"></div>
    <div class="form-group"><label>טלפון</label><input type="text" id="pPhone"></div>
    <div class="form-group">
      <label>סוג עוסק</label>
      <select id="pType">
        <option value="ptor">עוסק פטור</option>
        <option value="morasha">עוסק מורשה</option>
      </select>
    </div>
    <div class="form-group"><label>אחוז מע"מ (%)</label><input type="number" id="pVatRate" value="18"></div>
    <button class="btn btn-p" id="btnSaveSettings" style="width:100%">שמור הגדרות</button>
  </div>
</dialog>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  // --- הקונפיגורציה שלך ---
  const firebaseConfig = {
    apiKey: "AIzaSyDtMcQNNvB65mhzmSVO1hkQ2Z3Snp-uITE",
    authDomain: "freelance-accounting-6c3bb.firebaseapp.com",
    projectId: "freelance-accounting-6c3bb",
    storageBucket: "freelance-accounting-6c3bb.firebasestorage.app",
    messagingSenderId: "196974556694",
    appId: "1:196974556694:web:60ba710567f2a7c67c6737"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const categories = {
    "הכנסה מפעילות": { v: 1.0, t: 1.0, type: 'income' },
    "שיווק ופרסום": { v: 1.0, t: 1.0, type: 'expense' },
    "ציוד משרדי": { v: 1.0, t: 1.0, type: 'expense' },
    "אחזקת רכב (2/3 מוכר)": { v: 0.666, t: 0.45, type: 'expense' },
    "אחזקת רכב (1/4 מוכר)": { v: 0.25, t: 0.45, type: 'expense' },
    "תיקון רכב": { v: 0.666, t: 0.45, type: 'expense' },
    "דלק": { v: 0.666, t: 0.45, type: 'expense' },
    "ביטוח רכב": { v: 0.0, t: 0.45, type: 'expense' },
    "טסט רכב": { v: 0.0, t: 0.45, type: 'expense' },
    "טלפון וסלולר": { v: 0.666, t: 0.25, type: 'expense' },
    "אינטרנט ותקשורת": { v: 1.0, t: 1.0, type: 'expense' },
    "ביטוחים": { v: 0.0, t: 1.0, type: 'expense' },
    "כיבודים": { v: 0.0, t: 0.8, type: 'expense' },
    "שכר דירה עסקי": { v: 1.0, t: 1.0, type: 'expense' },
    "חשמל": { v: 1.0, t: 1.0, type: 'expense' },
    "ארנונה": { v: 0.0, t: 1.0, type: 'expense' },
    "מים": { v: 1.0, t: 1.0, type: 'expense' },
    "עמלות בנק": { v: 0.0, t: 1.0, type: 'expense' },
    "דואר ומשלוחים": { v: 1.0, t: 1.0, type: 'expense' },
    "ייעוץ מקצועי": { v: 1.0, t: 1.0, type: 'expense' },
    "השתלמויות": { v: 1.0, t: 1.0, type: 'expense' },
    "בגדי עבודה": { v: 0.0, t: 1.0, type: 'expense' },
    "מתנות ללקוחות": { v: 0.0, t: 1.0, type: 'expense' },
    "נסיעות לחו\"ל": { v: 0.0, t: 1.0, type: 'expense' }
  };

  let user = null;
  let profile = { pName: '', pId: '', pPhone: '', pType: 'ptor', pVatRate: 18 };

  // UI Functions
  window.showAuth = (mode) => {
    document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = mode === 'signup' ? 'block' : 'none';
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
  };

  const catSelect = document.getElementById('fCat');
  Object.keys(categories).forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);

  // Auth Handlers
  document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
    } catch (err) { document.getElementById('authError').textContent = "שגיאת התחברות: " + err.message; }
  };

  document.getElementById('signupForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const res = await createUserWithEmailAndPassword(auth, document.getElementById('signupEmail').value, document.getElementById('signupPass').value);
      await setDoc(doc(db, "users", res.user.uid), profile);
    } catch (err) { document.getElementById('authError').textContent = "שגיאת הרשמה: " + err.message; }
  };

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, async (u) => {
    if (u) {
      user = u;
      const snap = await getDoc(doc(db, "users", u.uid));
      if (snap.exists()) profile = { ...profile, ...snap.data() };
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('app').hidden = false;
      listenToData();
    } else {
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('app').hidden = true;
    }
  });

  // Data Handlers
  document.getElementById('txForm').onsubmit = async (e) => {
    e.preventDefault();
    const sum = parseFloat(document.getElementById('fSum').value);
    const cat = categories[document.getElementById('fCat').value];
    const isMorasha = profile.pType === 'morasha';
    const vatRate = isMorasha ? (profile.pVatRate / 100) : 0;

    const net = sum / (1 + vatRate);
    const vatTotal = sum - net;
    const recVat = vatTotal * cat.v;
    const recTax = (net + (vatTotal - recVat)) * cat.t;

    await addDoc(collection(db, "users", user.uid, "transactions"), {
      date: document.getElementById('fDate').value,
      type: document.getElementById('fType').value,
      cat: document.getElementById('fCat').value,
      desc: document.getElementById('fDesc').value,
      total: sum, net, recVat, recTax, created: Date.now()
    });
    e.target.reset();
    document.getElementById('fDate').valueAsDate = new Date();
  };

  function listenToData() {
    const q = query(collection(db, "users", user.uid, "transactions"), orderBy("date", "desc"));
    onSnapshot(q, (snap) => {
      const data = [];
      snap.forEach(d => data.push({ id: d.id, ...d.data() }));
      render(data);
    });
  }

  function render(data) {
    const month = document.getElementById('filterMonth').value;
    const filtered = month ? data.filter(t => t.date.startsWith(month)) : data;
    let ti=0, te=0, tv=0;

    document.getElementById('txBody').innerHTML = filtered.map(t => {
      const isInc = t.type === 'income';
      if(isInc) { ti += t.net; tv += t.recVat; } else { te += t.recTax; tv -= t.recVat; }
      return `<tr>
        <td>${t.date.split('-').reverse().join('/')}</td>
        <td><strong>${t.desc}</strong><br><small>${t.cat}</small></td>
        <td>₪${t.total.toFixed(2)}</td>
        <td>₪${t.recVat.toFixed(2)}</td>
        <td class="${isInc?'inc':'exp'}">₪${isInc ? t.net.toFixed(2) : t.recTax.toFixed(2)}</td>
        <td><button class="btn btn-danger" onclick="deleteTx('${t.id}')">מחיקה</button></td>
      </tr>`;
    }).join('');

    document.getElementById('sInc').textContent = `₪${ti.toLocaleString()}`;
    document.getElementById('sExp').textContent = `₪${te.toLocaleString()}`;
    document.getElementById('sVat').textContent = `₪${tv.toLocaleString()}`;
    document.getElementById('sNet').textContent = `₪${(ti - te).toLocaleString()}`;
  }

  window.deleteTx = (id) => confirm("למחוק תנועה?") && deleteDoc(doc(db, "users", user.uid, "transactions", id));

  // Settings
  document.getElementById('btnSettings').onclick = () => {
    ['pName','pId','pPhone','pType','pVatRate'].forEach(k => document.getElementById(k).value = profile[k]);
    document.getElementById('dlgSettings').showModal();
  };

  document.getElementById('btnSaveSettings').onclick = async () => {
    const updated = {
      pName: document.getElementById('pName').value,
      pId: document.getElementById('pId').value,
      pPhone: document.getElementById('pPhone').value,
      pType: document.getElementById('pType').value,
      pVatRate: parseFloat(document.getElementById('pVatRate').value)
    };
    await setDoc(doc(db, "users", user.uid), updated);
    profile = { ...profile, ...updated };
    document.getElementById('dlgSettings').close();
    location.reload();
  };

  window.openSupport = () => window.open("mailto:azmaiplusapp@gmail.com?subject=תמיכה בעצמאי פלוס");

  // Init
  document.getElementById('fDate').valueAsDate = new Date();
  document.getElementById('filterMonth').value = new Date().toISOString().slice(0, 7);
</script>
</body>
</html>
