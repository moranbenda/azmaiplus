<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עצמאי פלוס - הנהלת חשבונות מלאה</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg:#f4f7fa; --panel:#ffffff; --text:#1e293b; --text-dim:#64748b;
      --accent:#2563eb; --accent-hover:#1d4ed8; --good:#10b981; --bad:#ef4444;
      --line:#e2e8f0; --radius:14px; --shadow:0 4px 6px -1px rgba(0,0,0,0.1);
    }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; direction:rtl; }
    .wrap { max-width:1400px; margin:0 auto; padding:20px; }
    
    header { background:#fff; border-bottom:1px solid var(--line); padding:15px 0; sticky; top:0; z-index:100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .nav-flex { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .logo { font-size:24px; font-weight:800; color:var(--accent); text-decoration:none; }
    .nav-btns { display:flex; gap:8px; flex-wrap:wrap; }

    .card { background:var(--panel); border-radius:var(--radius); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:20px; }
    .card-hd { padding:15px 20px; border-bottom:1px solid var(--line); font-weight:700; background:#fafbfc; display:flex; justify-content:space-between; align-items:center; }
    .card-bd { padding:20px; }
    
    .btn { cursor:pointer; padding:8px 16px; border-radius:8px; border:none; font-weight:600; transition:0.2s; display:inline-flex; align-items:center; gap:6px; font-size:13px; }
    .btn-p { background:var(--accent); color:#fff; }
    .btn-s { background:#f1f5f9; color:var(--text); border:1px solid var(--line); }
    .btn-danger { background:#fee2e2; color:var(--bad); }

    .grid { display:grid; grid-template-columns: 350px 1fr; gap:20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:20px; }
    .stat-box { background:#fff; padding:15px; border-radius:12px; border:1px solid var(--line); text-align:center; }
    .stat-val { font-size:20px; font-weight:800; display:block; }

    table { width:100%; border-collapse:collapse; }
    th { text-align:right; padding:12px; background:#f8fafc; border-bottom:2px solid var(--line); font-size:13px; }
    td { padding:12px; border-bottom:1px solid var(--line); }

    .form-group { margin-bottom:12px; }
    label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
    input, select { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); }

    dialog { border:none; border-radius:16px; padding:0; width:min(600px, 95vw); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    .dlg-h { padding:15px 20px; background:#f8fafc; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; font-weight:700; }
    .dlg-b { padding:20px; max-height:70vh; overflow-y:auto; }

    #authOverlay { position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; align-items:center; justify-content:center; }
    .auth-box { background:#fff; padding:30px; border-radius:20px; box-shadow:var(--shadow); width:100%; max-width:400px; text-align:center; }
  </style>
</head>
<body>

<div id="authOverlay">
  <div class="auth-box">
    <h2 style="color:var(--accent)">עצמאי פלוס</h2>
    <div id="authUI">
      <input type="email" id="email" placeholder="אימייל" style="margin-bottom:10px">
      <input type="password" id="pass" placeholder="סיסמה" style="margin-bottom:15px">
      <button class="btn btn-p" style="width:100%" onclick="handleAuth('login')">התחברות</button>
      <button class="btn btn-s" style="width:100%; margin-top:8px" onclick="handleAuth('signup')">הרשמה (משתמש חדש)</button>
    </div>
    <p id="authError" style="color:var(--bad); font-size:12px; margin-top:10px"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap nav-flex">
      <div class="logo">עצמאי פלוס</div>
      <div class="nav-btns">
        <button class="btn btn-s" onclick="document.getElementById('dlgCats').showModal()">📊 טבלת קטגוריות</button>
        <button class="btn btn-s" onclick="window.open('https://www.gov.il/he/service/reporting-or-payment-of-vat-reports')">🏦 דיווח מע"מ</button>
        <button class="btn btn-s" onclick="document.getElementById('dlgSettings').showModal()">⚙️ הגדרות עסק</button>
        <button class="btn btn-s" onclick="openGmailSupport()">💬 פנייה למפתח</button>
        <button class="btn btn-danger" onclick="auth.signOut()">יציאה</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="stats">
      <div class="stat-box">הכנסות נטו<span class="stat-val" id="sInc" style="color:var(--good)">₪0</span></div>
      <div class="stat-box">הוצאות מוכרות<span class="stat-val" id="sExp" style="color:var(--bad)">₪0</span></div>
      <div class="stat-box">מע"מ (לתשלום/החזר)<span class="stat-val" id="sVat">₪0</span></div>
      <div class="stat-box">רווח לפני מס<span class="stat-val" id="sNet" style="color:var(--accent)">₪0</span></div>
    </div>

    <div class="grid">
      <section class="card">
        <div class="card-hd">➕ תנועה חדשה</div>
        <div class="card-bd">
          <form id="txForm">
            <div class="form-group"><label>תאריך</label><input type="date" id="fDate" required></div>
            <div class="form-group">
              <label>סוג</label>
              <select id="fType"><option value="income">הכנסה</option><option value="expense">הוצאה</option></select>
            </div>
            <div class="form-group"><label>קטגוריה</label><select id="fCat"></select></div>
            <div class="form-group"><label>תיאור</label><input type="text" id="fDesc" placeholder="שם ספק/לקוח" required></div>
            <div class="form-group"><label>סכום כולל (₪)</label><input type="number" step="0.01" id="fSum" required></div>
            <button type="submit" class="btn btn-p" style="width:100%; padding:12px">שמירה במערכת</button>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="card-hd">
          פירוט תנועות
          <div style="display:flex; gap:10px">
            <input type="month" id="filterMonth">
            <button class="btn btn-p" style="background:var(--good)" onclick="exportToExcel()">📥 ייצוא לאקסל</button>
          </div>
        </div>
        <div class="card-bd" style="overflow-x:auto">
          <table id="txTable">
            <thead>
              <tr>
                <th>תאריך</th>
                <th>תיאור / קטגוריה</th>
                <th>סה"כ</th>
                <th>מע"מ מוכר</th>
                <th>הוצאה מוכרת</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="txBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<dialog id="dlgCats">
  <div class="dlg-h">טבלת קטגוריות ואחוזי הכרה <button class="btn" onclick="this.closest('dialog').close()">X</button></div>
  <div class="dlg-b" id="catsListUI"></div>
</dialog>

<dialog id="dlgSettings">
  <div class="dlg-h">הגדרות עסק <button class="btn" onclick="this.closest('dialog').close()">X</button></div>
  <div class="dlg-b">
    <div class="form-group"><label>שם העסק</label><input type="text" id="pName"></div>
    <div class="form-group"><label>ח.פ / עוסק</label><input type="text" id="pId"></div>
    <div class="form-group"><label>טלפון</label><input type="text" id="pPhone"></div>
    <div class="form-group">
      <label>סוג עוסק</label>
      <select id="pType"><option value="ptor">עוסק פטור</option><option value="morasha">עוסק מורשה</option></select>
    </div>
    <div class="form-group"><label>אחוז מע"מ (%)</label><input type="number" id="pVatRate" value="18"></div>
    <button class="btn btn-p" style="width:100%" onclick="saveProfile()">שמירה</button>
  </div>
</dialog>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDtMcQNNvB65mhzmSVO1hkQ2Z3Snp-uITE",
    authDomain: "freelance-accounting-6c3bb.firebaseapp.com",
    projectId: "freelance-accounting-6c3bb",
    storageBucket: "freelance-accounting-6c3bb.firebasestorage.app",
    messagingSenderId: "196974556694",
    appId: "1:196974556694:web:60ba710567f2a7c67c6737"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const categories = {
    "הכנסה מפעילות": { v: 1.0, t: 1.0, type: 'income' },
    "שיווק ופרסום": { v: 1.0, t: 1.0, type: 'expense' },
    "ציוד משרדי": { v: 1.0, t: 1.0, type: 'expense' },
    "אחזקת רכב (2/3 מוכר)": { v: 0.666, t: 0.45, type: 'expense' },
    "אחזקת רכב (1/4 מוכר)": { v: 0.25, t: 0.45, type: 'expense' },
    "תיקון רכב": { v: 0.666, t: 0.45, type: 'expense' },
    "דלק": { v: 0.666, t: 0.45, type: 'expense' },
    "ביטוח רכב": { v: 0.0, t: 0.45, type: 'expense' },
    "טסט רכב": { v: 0.0, t: 0.45, type: 'expense' },
    "טלפון וסלולר": { v: 0.666, t: 0.25, type: 'expense' },
    "אינטרנט ותקשורת": { v: 1.0, t: 1.0, type: 'expense' },
    "ביטוחים": { v: 0.0, t: 1.0, type: 'expense' },
    "כיבודים": { v: 0.0, t: 0.8, type: 'expense' },
    "שכר דירה עסקי": { v: 1.0, t: 1.0, type: 'expense' },
    "חשמל": { v: 1.0, t: 1.0, type: 'expense' },
    "ארנונה": { v: 0.0, t: 1.0, type: 'expense' },
    "מים": { v: 1.0, t: 1.0, type: 'expense' },
    "עמלות בנק": { v: 0.0, t: 1.0, type: 'expense' },
    "דואר ומשלוחים": { v: 1.0, t: 1.0, type: 'expense' },
    "ייעוץ מקצועי": { v: 1.0, t: 1.0, type: 'expense' },
    "השתלמויות": { v: 1.0, t: 1.0, type: 'expense' },
    "בגדי עבודה": { v: 0.0, t: 1.0, type: 'expense' },
    "מתנות ללקוחות": { v: 0.0, t: 1.0, type: 'expense' },
    "נסיעות לחו\"ל": { v: 0.0, t: 1.0, type: 'expense' }
  };

  let user = null, profile = { pName:'', pId:'', pPhone:'', pType:'ptor', pVatRate:18 }, allTx = [];

  // Auth Handling
  window.handleAuth = async (mode) => {
    const email = document.getElementById('email').value, pass = document.getElementById('pass').value;
    try {
      if(mode === 'login') await signInWithEmailAndPassword(auth, email, pass);
      else {
        const res = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, "users", res.user.uid), profile);
      }
    } catch(e) { document.getElementById('authError').textContent = e.message; }
  };

  onAuthStateChanged(auth, async (u) => {
    if(u) {
      user = u;
      const snap = await getDoc(doc(db, "users", u.uid));
      if(snap.exists()) profile = {...profile, ...snap.data()};
      document.getElementById('authOverlay').hidden = true;
      document.getElementById('app').hidden = false;
      init();
    } else {
      document.getElementById('authOverlay').hidden = false;
      document.getElementById('app').hidden = true;
    }
  });

  function init() {
    // Populate Categories
    const sel = document.getElementById('fCat'), list = document.getElementById('catsListUI');
    sel.innerHTML = '';
    let html = '<table><tr><th>קטגוריה</th><th>מע"מ מוכר</th><th>מס מוכר</th></tr>';
    Object.keys(categories).forEach(k => {
      sel.innerHTML += `<option value="${k}">${k}</option>`;
      html += `<tr><td>${k}</td><td>${(categories[k].v*100).toFixed(0)}%</td><td>${(categories[k].t*100).toFixed(0)}%</td></tr>`;
    });
    list.innerHTML = html + '</table>';

    // Listen to Data
    const q = query(collection(db, "users", user.uid, "transactions"), orderBy("date", "desc"));
    onSnapshot(q, (snap) => {
      allTx = [];
      snap.forEach(d => allTx.push({id: d.id, ...d.data()}));
      render();
    });
  }

  // --- הוספת תנועה ---
  document.getElementById('txForm').onsubmit = async (e) => {
    e.preventDefault();
    const sum = parseFloat(document.getElementById('fSum').value);
    const catName = document.getElementById('fCat').value;
    const cat = categories[catName];
    const vatRate = profile.pType === 'morasha' ? (profile.pVatRate/100) : 0;

    const net = sum / (1 + vatRate);
    const totalVat = sum - net;
    const recVat = totalVat * cat.v;
    const recTax = (net + (totalVat - recVat)) * cat.t;

    await addDoc(collection(db, "users", user.uid, "transactions"), {
      date: document.getElementById('fDate').value,
      type: document.getElementById('fType').value,
      cat: catName, desc: document.getElementById('fDesc').value,
      total: sum, net, recVat, recTax, created: Date.now()
    });
    e.target.reset();
    document.getElementById('fDate').valueAsDate = new Date();
  };

  function render() {
    const month = document.getElementById('filterMonth').value;
    const filtered = month ? allTx.filter(t => t.date.startsWith(month)) : allTx;
    let ti=0, te=0, tv=0;

    document.getElementById('txBody').innerHTML = filtered.map(t => {
      const isInc = t.type === 'income';
      if(isInc) { ti += t.net; tv += t.recVat; } else { te += t.recTax; tv -= t.recVat; }
      return `<tr>
        <td>${t.date.split('-').reverse().join('/')}</td>
        <td><strong>${t.desc}</strong><br><small>${t.cat}</small></td>
        <td>₪${t.total.toFixed(2)}</td>
        <td>₪${t.recVat.toFixed(2)}</td>
        <td style="color:${isInc?'var(--good)':'var(--bad)'}">₪${isInc ? t.net.toFixed(2) : t.recTax.toFixed(2)}</td>
        <td><button class="btn btn-danger" onclick="deleteTx('${t.id}')">X</button></td>
      </tr>`;
    }).join('');

    document.getElementById('sInc').textContent = `₪${ti.toLocaleString()}`;
    document.getElementById('sExp').textContent = `₪${te.toLocaleString()}`;
    document.getElementById('sVat').textContent = `₪${tv.toLocaleString()}`;
    document.getElementById('sNet').textContent = `₪${(ti - te).toLocaleString()}`;
  }

  window.deleteTx = (id) => confirm("למחוק?") && deleteDoc(doc(db, "users", user.uid, "transactions", id));

  // Settings
  window.saveProfile = async () => {
    profile = {
      pName: document.getElementById('pName').value,
      pId: document.getElementById('pId').value,
      pPhone: document.getElementById('pPhone').value,
      pType: document.getElementById('pType').value,
      pVatRate: parseFloat(document.getElementById('pVatRate').value)
    };
    await setDoc(doc(db, "users", user.uid), profile);
    document.getElementById('dlgSettings').close();
    render();
  };

  window.openGmailSupport = () => {
    window.open("https://mail.google.com/mail/?view=cm&fs=1&to=azmaiplusapp@gmail.com&su=פנייה מאפליקציית עצמאי פלוס");
  };

  // Export
  window.exportToExcel = () => {
    const rows = [
      ["פרטי עסק:", profile.pName, "עוסק:", profile.pId, "טלפון:", profile.pPhone],
      [],
      ["תאריך", "תיאור", "קטגוריה", "סה\"כ", "מע\"מ מוכר", "הוצאה מוכרת"]
    ];
    allTx.forEach(t => rows.push([t.date, t.desc, t.cat, t.total, t.recVat, t.recTax]));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "דוח");
    XLSX.writeFile(wb, `עצמאי_פלוס_${profile.pName}.xlsx`);
  };

  document.getElementById('filterMonth').onchange = render;
  document.getElementById('fDate').valueAsDate = new Date();
  document.getElementById('filterMonth').value = new Date().toISOString().slice(0, 7);
</script>
</body>
</html>
