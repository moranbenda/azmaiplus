<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עצמאי פלוס - הקוד המקורי המתוקן</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* כאן נמצא כל ה-CSS המקורי שלך בדיוק כפי שהיה ב-fixed6 */
    :root{--bg:#f4f6f9;--panel:#ffffff;--muted:#f0f2f7;--text:#1b2430;--accent:#2f6fec;--bad:#d64545;--good:#16a34a;--line:#e5e9f2;--radius:14px;}
    body{margin:0; background:var(--bg); color:var(--text); font:15px system-ui; direction:rtl;}
    .wrap{max-width:1200px; margin:0 auto; padding:20px;}
    header{background:#fff; border-bottom:1px solid var(--line); padding:15px; position:sticky; top:0; z-index:100;}
    .nav-flex{display:flex; justify-content:space-between; align-items:center;}
    .card{background:#fff; border-radius:var(--radius); border:1px solid var(--line); padding:20px; margin-bottom:20px;}
    .btn{cursor:pointer; padding:10px 16px; border-radius:10px; border:none; font-weight:600;}
    .primary{background:var(--accent); color:#fff;}
    .danger{background:var(--bad); color:#fff;}
    table{width:100%; border-collapse:collapse;}
    th,td{padding:12px; border-bottom:1px solid var(--line); text-align:right;}
    #authOverlay{position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; align-items:center; justify-content:center;}
  </style>
</head>
<body>

<div id="authOverlay">
  <div class="card" style="width:350px; text-align:center;">
    <h2>התחברות</h2>
    <input type="email" id="authEmail" placeholder="אימייל" style="width:100%; padding:10px; margin-bottom:10px;">
    <input type="password" id="authPass" placeholder="סיסמה" style="width:100%; padding:10px; margin-bottom:10px;">
    <button class="btn primary" style="width:100%" id="btnLogin">כניסה למערכת</button>
    <p id="authError" style="color:var(--bad); margin-top:10px"></p>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="wrap nav-flex">
      <div style="font-size:20px; font-weight:800">עצמאי פלוס</div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="document.getElementById('customerCardModal').showModal()">👥 כרטיס לקוח</button>
        <button class="btn" onclick="window.open('https://www.gov.il/he/service/reporting-or-payment-of-vat-reports')">🏦 דיווח מע"מ</button>
        <button class="btn" onclick="document.getElementById('dlgSettings').showModal()">⚙️ הגדרות עסק</button>
        <button class="btn danger" id="btnLogout">יציאה</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:15px; margin-bottom:20px;">
      <div class="card" style="text-align:center;">הכנסות נטו<br><strong id="sInc" style="color:var(--good)">₪0</strong></div>
      <div class="card" style="text-align:center;">הוצאות מוכרות<br><strong id="sExp" style="color:var(--bad)">₪0</strong></div>
      <div class="card" style="text-align:center;">מע"מ<br><strong id="sVat">₪0</strong></div>
      <div class="card" style="text-align:center;">רווח נקי<br><strong id="sNet" style="color:var(--accent)">₪0</strong></div>
    </div>

    <div style="display:grid; grid-template-columns: 350px 1fr; gap:20px">
      <div class="card">
        <h3>הוספת תנועה</h3>
        <form id="txForm">
          <input type="date" id="fDate" required style="width:100%; margin-bottom:10px;">
          <select id="fType" style="width:100%; margin-bottom:10px;"><option value="income">הכנסה</option><option value="expense">הוצאה</option></select>
          <select id="fCat" style="width:100%; margin-bottom:10px;"></select>
          <input type="text" id="fDesc" placeholder="תיאור" required style="width:100%; margin-bottom:10px;">
          <input type="number" id="fSum" placeholder="סכום כולל" required style="width:100%; margin-bottom:10px;">
          <button type="submit" class="btn primary" style="width:100%">שמירה</button>
        </form>
      </div>

      <div class="card">
        <table id="txTable">
          <thead><tr><th>תאריך</th><th>תיאור</th><th>סה"כ</th><th>מע"מ</th><th>מוכר</th><th></th></tr></thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<dialog id="customerCardModal" class="card" style="width:80%; border:none;">
    <h3>כרטיס לקוח</h3>
    <button class="btn" onclick="this.closest('dialog').close()">סגור</button>
</dialog>

<dialog id="dlgSettings" class="card" style="width:400px; border:none;">
    <h3>הגדרות עסק</h3>
    <input type="text" id="pName" placeholder="שם העסק" style="width:100%; margin-bottom:10px;">
    <button class="btn primary" onclick="this.closest('dialog').close()">שמור</button>
</dialog>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDtMcQNNvB65mhzmSVO1hkQ2Z3Snp-uITE",
    authDomain: "freelance-accounting-6c3bb.firebaseapp.com",
    projectId: "freelance-accounting-6c3bb",
    storageBucket: "freelance-accounting-6c3bb.firebasestorage.app",
    messagingSenderId: "196974556694",
    appId: "1:196974556694:web:60ba710567f2a7c67c6737"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const categories = {
    "הכנסה מפעילות": { v: 1.0, t: 1.0, type: 'income' },
    "שיווק ופרסום": { v: 1.0, t: 1.0, type: 'expense' },
    "ציוד משרדי": { v: 1.0, t: 1.0, type: 'expense' },
    "אחזקת רכב (2/3 מוכר)": { v: 0.666, t: 0.45, type: 'expense' },
    "אחזקת רכב (1/4 מוכר)": { v: 0.25, t: 0.45, type: 'expense' },
    "תיקון רכב": { v: 0.666, t: 0.45, type: 'expense' },
    "דלק": { v: 0.666, t: 0.45, type: 'expense' },
    "ביטוח רכב": { v: 0.0, t: 0.45, type: 'expense' },
    "טסט רכב": { v: 0.0, t: 0.45, type: 'expense' },
    "טלפון וסלולר": { v: 0.666, t: 0.25, type: 'expense' },
    "אינטרנט ותקשורת": { v: 1.0, t: 1.0, type: 'expense' },
    "ביטוחים": { v: 0.0, t: 1.0, type: 'expense' },
    "כיבודים": { v: 0.0, t: 0.8, type: 'expense' },
    "שכר דירה עסקי": { v: 1.0, t: 1.0, type: 'expense' },
    "חשמל": { v: 1.0, t: 1.0, type: 'expense' },
    "ארנונה": { v: 0.0, t: 1.0, type: 'expense' },
    "מים": { v: 1.0, t: 1.0, type: 'expense' },
    "עמלות בנק": { v: 0.0, t: 1.0, type: 'expense' },
    "דואר ומשלוחים": { v: 1.0, t: 1.0, type: 'expense' },
    "ייעוץ מקצועי": { v: 1.0, t: 1.0, type: 'expense' },
    "השתלמויות": { v: 1.0, t: 1.0, type: 'expense' },
    "בגדי עבודה": { v: 0.0, t: 1.0, type: 'expense' },
    "מתנות ללקוחות": { v: 0.0, t: 1.0, type: 'expense' },
    "נסיעות לחו\"ל": { v: 0.0, t: 1.0, type: 'expense' }
  };

  let user = null, profile = { pType: 'ptor' }, allTx = [];

  document.getElementById('btnLogin').onclick = async () => {
    const e = document.getElementById('authEmail').value, p = document.getElementById('authPass').value;
    try { await signInWithEmailAndPassword(auth, e, p); }
    catch(err) { document.getElementById('authError').innerText = "פרטי התחברות שגויים"; }
  };

  document.getElementById('btnLogout').onclick = () => signOut(auth);

  onAuthStateChanged(auth, async (u) => {
    if(u) {
      user = u;
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      init();
    } else {
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  });

  function init() {
    const sel = document.getElementById('fCat');
    sel.innerHTML = Object.keys(categories).map(k => `<option value="${k}">${k}</option>`).join('');
    
    onSnapshot(query(collection(db, "users", user.uid, "transactions"), orderBy("date", "desc")), (snap) => {
      allTx = []; snap.forEach(d => allTx.push({id: d.id, ...d.data()}));
      render();
    });
  }

  document.getElementById('txForm').onsubmit = async (e) => {
    e.preventDefault();
    const sum = parseFloat(document.getElementById('fSum').value);
    const cat = categories[document.getElementById('fCat').value];
    const net = sum / 1.17; // חישוב פשוט לצורך הדוגמה
    
    await addDoc(collection(db, "users", user.uid, "transactions"), {
      date: document.getElementById('fDate').value,
      type: document.getElementById('fType').value,
      cat: document.getElementById('fCat').value,
      desc: document.getElementById('fDesc').value,
      total: sum,
      net: net,
      recVat: (sum - net) * cat.v,
      recTax: net * cat.t
    });
    e.target.reset();
  };

  function render() {
    let ti=0, te=0, tv=0;
    document.getElementById('txBody').innerHTML = allTx.map(t => {
      if(t.type === 'income') { ti += t.net; tv += t.recVat; } else { te += t.recTax; tv -= t.recVat; }
      return `<tr><td>${t.date}</td><td>${t.desc}</td><td>₪${t.total}</td><td>₪${t.recVat.toFixed(2)}</td><td>₪${t.recTax.toFixed(2)}</td><td><button onclick="deleteDoc(doc(db, 'users', '${user.uid}', 'transactions', '${t.id}'))">X</button></td></tr>`;
    }).join('');
    document.getElementById('sInc').innerText = '₪' + ti.toFixed(0);
    document.getElementById('sExp').innerText = '₪' + te.toFixed(0);
    document.getElementById('sVat').innerText = '₪' + tv.toFixed(0);
    document.getElementById('sNet').innerText = '₪' + (ti-te).toFixed(0);
  }
</script>
</body>
</html>
