<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עצמאי פלוס - הנהלת חשבונות עצמאית</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root{
      --bg:#f4f6f9;
      --panel:#ffffff;
      --muted:#f0f2f7;
      --text:#1b2430;
      --text-dim:#5b6573;
      --accent:#2f6fec;
      --accent-2:#0ea66c;
      --bad:#d64545;
      --good:#16a34a;
      --warning:#b7791f;
      --card-shadow:0 8px 24px rgba(0,0,0,.08);
      --radius:14px;
      --line:#e5e9f2;
      --input-bg:#fafbfe;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:linear-gradient(180deg,#ffffff,#f6f8fb 40%,#eef2f7 100%);
      color:var(--text);
      font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      direction:rtl;
    }
    .auth-screen{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
    .auth-card{background:#fff;width:100%;max-width:400px;padding:40px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.1);text-align:center}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:10px 20px;border-radius:12px;border:none;font-weight:700;
      cursor:pointer;transition:all .2s cubic-bezier(0.4,0,0.2,1);font-size:14px;
    }
    .btn.primary{background:var(--accent);color:#fff}
    .btn.primary:hover{background:#1e56c7;transform:translateY(-1px);box-shadow:0 4px 12px rgba(47,111,236,0.3)}
    .btn.danger{background:#fff1f1;color:var(--bad)}
    .btn.danger:hover{background:var(--bad);color:#fff}
    .card{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--card-shadow);padding:24px;position:relative}
    header{background:rgba(255,255,255,0.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 0;position:sticky;top:0;z-index:1000}
    .nav-inner{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:30px}
    .stat-card{text-align:center;padding:20px;border-radius:var(--radius);background:#fff;border:1px solid var(--line)}
    .stat-val{display:block;font-size:28px;font-weight:900;margin-top:8px}
    input,select{
      width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);
      background:var(--input-bg);font-size:15px;transition:all .2s;margin-bottom:12px;
    }
    input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(47,111,236,0.1)}
    label{display:block;font-weight:700;margin-bottom:6px;font-size:13px;color:var(--text-dim)}
    .tbl{width:100%;border-collapse:collapse}
    .tbl th{background:var(--muted);padding:14px;text-align:right;font-weight:800;font-size:13px;color:var(--text-dim);border-bottom:2px solid var(--line)}
    .tbl td{padding:14px;border-bottom:1px solid var(--line);font-size:14px}
    .modal{position:fixed;inset:0;background:rgba(27,36,48,0.6);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
    .modal.active{display:flex}
    .modal-card{background:#fff;border-radius:24px;width:100%;max-width:600px;padding:32px;box-shadow:0 24px 64px rgba(0,0,0,0.2)}
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div style="font-size:28px;font-weight:900;color:var(--accent);margin-bottom:8px">עצמאי פלוס</div>
    <div style="color:var(--text-dim);margin-bottom:32px">ניהול פיננסי חכם לעסק שלך</div>
    <div style="text-align:right">
      <label>אימייל</label>
      <input type="email" id="authEmail" placeholder="your@email.com">
      <label>סיסמה</label>
      <input type="password" id="authPass" placeholder="••••••••">
    </div>
    <button class="btn primary" id="btnAuth" style="width:100%;padding:14px;font-size:16px;margin-top:10px">כניסה / הרשמה</button>
    <div id="authError" style="color:var(--bad);margin-top:16px;font-size:14px;min-height:20px;font-weight:600"></div>
  </div>
</div>

<div id="mainApp" class="hidden">
  <header>
    <div class="nav-inner">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px">+</div>
        <div style="font-size:22px;font-weight:900;color:var(--text);letter-spacing:-0.5px">עצמאי פלוס</div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="btnCustomerCard">👥 כרטיס לקוח</button>
        <button class="btn" id="btnVatReport">🏦 דיווח מע"מ</button>
        <button class="btn" id="btnReports">📄 דוחות</button>
        <button class="btn" id="btnSettings">⚙️ הגדרות עסק</button>
        <button class="btn danger" id="btnLogout">יציאה</button>
      </div>
    </div>
  </header>
  <main style="max-width:1240px;margin:30px auto;padding:0 20px">
    <div class="stats-grid">
      <div class="stat-card">
        <span style="color:var(--text-dim);font-size:13px;font-weight:700">הכנסות נטו</span>
        <span class="stat-val" id="sInc" style="color:var(--good)">₪0</span>
      </div>
      <div class="stat-card">
        <span style="color:var(--text-dim);font-size:13px;font-weight:700">הוצאות מוכרות</span>
        <span class="stat-val" id="sExp" style="color:var(--bad)">₪0</span>
      </div>
      <div class="stat-card">
        <span style="color:var(--text-dim);font-size:13px;font-weight:700">מע"מ (לתשלום/החזר)</span>
        <span class="stat-val" id="sVat">₪0</span>
      </div>
      <div class="stat-card" style="background:var(--accent);border:none">
        <span style="color:rgba(255,255,255,0.8);font-size:13px;font-weight:700">רווח נקי</span>
        <span class="stat-val" id="sNet" style="color:#fff">₪0</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:380px 1fr;gap:25px;align-items:start">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
          <h3 id="formTitle" style="margin:0;font-size:18px;font-weight:900">תנועה חדשה</h3>
          <span id="editIndicator" class="hidden" style="background:var(--warning);color:#fff;padding:2px 8px;border-radius:6px;font-size:11px">עריכה</span>
        </div>
        
        <form id="txForm">
          <input type="hidden" id="fId" />
          
          <label>תאריך</label>
          <input type="date" id="fDate" required />

          <label>סוג תנועה</label>
          <select id="fType">
            <option value="income">הכנסה (+)</option>
            <option value="expense">הוצאה (-)</option>
          </select>

          <label>קטגוריה</label>
          <select id="fCat"></select>

          <label>תיאור / ספק / לקוח</label>
          <input type="text" id="fDesc" placeholder="למשל: ייעוץ עסקי, רכישת ציוד..." required />

          <label id="sumLabel">סכום כולל (כולל מע"מ במידה ויש)</label>
          <input type="number" step="0.01" id="fSum" placeholder="0.00" required />

          <div style="margin-top:20px;display:flex;gap:10px">
            <button type="submit" class="btn primary" style="flex:1;padding:14px">שמירה במערכת</button>
            <button type="button" id="btnCancel" class="btn hidden" style="background:var(--muted)">ביטול</button>
          </div>
        </form>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fcfdfe">
          <h3 style="margin:0;font-size:17px;font-weight:900">פירוט תנועות</h3>
          <div style="display:flex;gap:12px;align-items:center">
            <input type="month" id="filterMonth" style="margin:0;padding:8px;width:160px" />
            <button class="btn" id="btnExportXls" style="padding:8px 12px;background:#e7f5ee;color:#0a8554;font-size:13px">Excel</button>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table class="tbl" id="txTable">
            <thead>
              <tr>
                <th>תאריך</th>
                <th>תיאור / קטגוריה</th>
                <th>סה"כ</th>
                <th>מע"מ</th>
                <th>מוכר</th>
                <th style="width:100px">פעולות</th>
              </tr>
            </thead>
            <tbody id="txBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:30px">
      <h3 style="margin:0 0 20px;font-size:17px">מנגנון חישוב הוצאות מוכרות</h3>
      <div id="catsTableUI"></div>
    </div>
  </main>
</div>

<div class="modal" id="customerCardModal">
  <div class="modal-card" style="max-width:980px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <h2 style="margin:0">כרטיס לקוח</h2>
      <button class="btn" onclick="document.getElementById('customerCardModal').classList.remove('active')">סגירה</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px">
        <div>
            <label>בחרי לקוח</label>
            <select id="ccSelect"></select>
        </div>
        <div>
            <label>שם לקוח</label>
            <input id="ccName" type="text" />
        </div>
        <div>
            <label>טלפון</label>
            <input id="ccPhone" type="text" />
        </div>
        <div>
            <label>ח.פ / עוסק</label>
            <input id="ccVatId" type="text" />
        </div>
    </div>
    <div style="display:flex;gap:10px">
        <button class="btn primary" id="ccSave">שמירת לקוח</button>
        <button class="btn danger" id="ccDelete">מחיקה</button>
    </div>
  </div>
</div>

<div class="modal" id="dlgSettings">
  <div class="modal-card" style="max-width:450px">
    <h3 style="margin-top:0">הגדרות עסק</h3>
    <label>שם העסק / בעלת העסק</label>
    <input type="text" id="pName" />
    <label>ח.פ / ת.ז</label>
    <input type="text" id="pId" />
    <label>טלפון</label>
    <input type="text" id="pPhone" />
    <label>סוג עוסק</label>
    <select id="pType">
      <option value="ptor">עוסק פטור</option>
      <option value="morasha">עוסק מורשה</option>
    </select>
    <button class="btn primary" id="btnSaveSettings" style="width:100%;margin-top:10px">שמירת הגדרות</button>
    <button class="btn" style="width:100%;margin-top:10px" onclick="document.getElementById('dlgSettings').classList.remove('active')">סגירה</button>
  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, onSnapshot, deleteDoc, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDtMcQNNvB65mhzmSVO1hkQ2Z3Snp-uITE",
    authDomain: "freelance-accounting-6c3bb.firebaseapp.com",
    projectId: "freelance-accounting-6c3bb",
    storageBucket: "freelance-accounting-6c3bb.firebasestorage.app",
    messagingSenderId: "196974556694",
    appId: "1:196974556694:web:60ba710567f2a7c67c6737"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const categories = {
    "הכנסה מפעילות": { v: 1.0, t: 1.0, type: 'income' },
    "שיווק ופרסום": { v: 1.0, t: 1.0, type: 'expense' },
    "ציוד משרדי": { v: 1.0, t: 1.0, type: 'expense' },
    "אחזקת רכב (2/3 מוכר)": { v: 0.666, t: 0.45, type: 'expense' },
    "אחזקת רכב (1/4 מוכר)": { v: 0.25, t: 0.45, type: 'expense' },
    "תיקון רכב": { v: 0.666, t: 0.45, type: 'expense' },
    "דלק": { v: 0.666, t: 0.45, type: 'expense' },
    "ביטוח רכב": { v: 0.0, t: 0.45, type: 'expense' },
    "טסט רכב": { v: 0.0, t: 0.45, type: 'expense' },
    "טלפון וסלולר": { v: 0.666, t: 0.25, type: 'expense' },
    "אינטרנט ותקשורת": { v: 1.0, t: 1.0, type: 'expense' },
    "ביטוחים": { v: 0.0, t: 1.0, type: 'expense' },
    "כיבודים": { v: 0.0, t: 0.8, type: 'expense' },
    "שכר דירה עסקי": { v: 1.0, t: 1.0, type: 'expense' },
    "חשמל": { v: 1.0, t: 1.0, type: 'expense' },
    "ארנונה": { v: 0.0, t: 1.0, type: 'expense' },
    "מים": { v: 1.0, t: 1.0, type: 'expense' },
    "עמלות בנק": { v: 0.0, t: 1.0, type: 'expense' },
    "דואר ומשלוחים": { v: 1.0, t: 1.0, type: 'expense' },
    "ייעוץ מקצועי": { v: 1.0, t: 1.0, type: 'expense' },
    "השתלמויות": { v: 1.0, t: 1.0, type: 'expense' },
    "בגדי עבודה": { v: 0.0, t: 1.0, type: 'expense' },
    "מתנות ללקוחות": { v: 0.0, t: 1.0, type: 'expense' },
    "נסיעות לחו\"ל": { v: 0.0, t: 1.0, type: 'expense' }
  };

  let user = null, profile = { pName:'', pId:'', pPhone:'', pType:'ptor' }, allTx = [];

  // --- לוגיקת התחברות מתוקנת ---
  document.getElementById('btnAuth').onclick = async () => {
    const email = document.getElementById('authEmail').value;
    const pass = document.getElementById('authPass').value;
    if(!email || !pass) return;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      if (err.code === 'auth/user-not-found') {
        try { await createUserWithEmailAndPassword(auth, email, pass); } 
        catch (e2) { document.getElementById('authError').innerText = "שגיאה ביצירת חשבון"; }
      } else { document.getElementById('authError').innerText = "פרטי התחברות שגויים"; }
    }
  };

  onAuthStateChanged(auth, async (u) => {
    if(u) {
      user = u;
      const s = await getDoc(doc(db, "users", u.uid));
      if(s.exists()) profile = s.data();
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      initApp();
    } else {
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('mainApp').classList.add('hidden');
    }
  });

  function initApp() {
    // מילוי קטגוריות
    const sel = document.getElementById('fCat');
    sel.innerHTML = Object.keys(categories).map(k => `<option value="${k}">${k}</option>`).join('');
    
    // מילוי טבלת הסברים
    let h = '<table class="tbl"><tr><th>קטגוריה</th><th>מע"מ מוכר</th><th>מס מוכר</th></tr>';
    for(let k in categories) h+=`<tr><td>${k}</td><td>${(categories[k].v*100).toFixed(0)}%</td><td>${(categories[k].t*100).toFixed(0)}%</td></tr>`;
    document.getElementById('catsTableUI').innerHTML = h + '</table>';

    // האזנה לנתונים
    onSnapshot(query(collection(db, "users", user.uid, "transactions"), orderBy("date", "desc")), (snap) => {
      allTx = []; snap.forEach(d => allTx.push({id: d.id, ...d.data()}));
      renderTable();
    });
  }

  // --- לוגיקת שמירה מתוקנת ---
  document.getElementById('txForm').onsubmit = async (e) => {
    e.preventDefault();
    const sum = parseFloat(document.getElementById('fSum').value);
    const cat = categories[document.getElementById('fCat').value];
    const isMorasha = profile.pType === 'morasha';
    const vatRate = isMorasha ? 0.17 : 0;
    
    const net = sum / (1 + vatRate);
    const vat = sum - net;
    const recVat = vat * cat.v;
    const recTax = (net + (vat - recVat)) * cat.t;

    const data = {
      date: document.getElementById('fDate').value,
      type: document.getElementById('fType').value,
      cat: document.getElementById('fCat').value,
      desc: document.getElementById('fDesc').value,
      total: sum, net, recVat, recTax
    };

    const id = document.getElementById('fId').value;
    if(id) await updateDoc(doc(db, "users", user.uid, "transactions", id), data);
    else await addDoc(collection(db, "users", user.uid, "transactions"), data);

    e.target.reset();
    document.getElementById('fId').value = "";
    document.getElementById('fDate').valueAsDate = new Date();
  };

  function renderTable() {
    let ti=0, te=0, tv=0;
    document.getElementById('txBody').innerHTML = allTx.map(t => {
      const isInc = t.type === 'income';
      if(isInc) { ti += t.net; tv += t.recVat; } else { te += t.recTax; tv -= t.recVat; }
      return `<tr>
        <td>${t.date.split('-').reverse().join('/')}</td>
        <td><strong>${t.desc}</strong><br><small>${t.cat}</small></td>
        <td>₪${t.total.toFixed(2)}</td>
        <td>₪${t.recVat.toFixed(2)}</td>
        <td style="color:${isInc?'var(--good)':'var(--bad)'}">₪${isInc?t.net.toFixed(2):t.recTax.toFixed(2)}</td>
        <td>
          <button class="btn" onclick="editTx('${t.id}')">✏️</button>
          <button class="btn danger" onclick="deleteTx('${t.id}')">✕</button>
        </td>
      </tr>`;
    }).join('');
    document.getElementById('sInc').innerText = '₪'+ti.toLocaleString();
    document.getElementById('sExp').innerText = '₪'+te.toLocaleString();
    document.getElementById('sVat').innerText = '₪'+tv.toLocaleString();
    document.getElementById('sNet').innerText = '₪'+(ti-te).toLocaleString();
  }

  window.editTx = (id) => {
    const t = allTx.find(x => x.id === id);
    document.getElementById('fId').value = t.id;
    document.getElementById('fDate').value = t.date;
    document.getElementById('fType').value = t.type;
    document.getElementById('fCat').value = t.cat;
    document.getElementById('fDesc').value = t.desc;
    document.getElementById('fSum').value = t.total;
    document.getElementById('formTitle').innerText = "עריכת תנועה";
  };

  window.deleteTx = (id) => confirm("למחוק תנועה זו?") && deleteDoc(doc(db, "users", user.uid, "transactions", id));

  document.getElementById('btnLogout').onclick = () => signOut(auth);
  document.getElementById('btnSettings').onclick = () => {
    document.getElementById('pName').value = profile.pName || '';
    document.getElementById('pId').value = profile.pId || '';
    document.getElementById('pPhone').value = profile.pPhone || '';
    document.getElementById('pType').value = profile.pType || 'ptor';
    document.getElementById('dlgSettings').classList.add('active');
  };
  document.getElementById('btnSaveSettings').onclick = async () => {
    profile = {
      pName: document.getElementById('pName').value,
      pId: document.getElementById('pId').value,
      pPhone: document.getElementById('pPhone').value,
      pType: document.getElementById('pType').value
    };
    await setDoc(doc(db, "users", user.uid), profile);
    document.getElementById('dlgSettings').classList.remove('active');
    renderTable();
  };
  document.getElementById('btnCustomerCard').onclick = () => document.getElementById('customerCardModal').classList.add('active');
  document.getElementById('fDate').valueAsDate = new Date();
</script>
</body>
</html>
